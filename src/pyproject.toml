[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intentgraph"
version = "0.1.0"
description = "IntentGraph core library — data model, lens operations, and agent serialization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Shield-1.0.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.8",
    "mypy>=1.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = false
warn_return_any = true
warn_unused_configs = true
