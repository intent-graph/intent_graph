[project]
name = "intentgraph-tools"
version = "0.1.0"
description = "IntentGraph — intent-first system design. Core library, agent infrastructure, and ig-tool CLI."
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.8",
    "mypy>=1.0",
    "pytest-cov>=4.0",
]

[project.scripts]
ig-tool = "ig_agents.cli:main"

[tool.pytest.ini_options]
testpaths = ["src/tests", "agents_runtime/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/src/intentgraph",
    "agents_runtime/src/ig_agents",
]
