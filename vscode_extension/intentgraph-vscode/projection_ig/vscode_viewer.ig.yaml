  epistemic_state: known
  constraints:
  - Active lens name is stored on PanelEntry in-memory only (not workspaceState, not
    IG file).
  - 'On panel open: if meta.default_lens is set, it is applied via BootCompleteNotification
    then ApplyLensNotification.'
  - 'On file reload: if a lens was active, it is re-applied after the new model loads.'
  - Lens content (LensConfig) is always re-read from the IG file on apply; never from
    a stale in-memory copy.
  impl_pointers: src/editor/IntentGraphEditorProvider.ts::PanelEntry
- uid: PERSISTENCE.AUTOSAVE
  name: Debounced Auto-Save
  intent: Define the write contract for persisting lens state after user interactions
    so that on-disk lens is always the source of truth with no explicit save step.
  epistemic_state: 'known: implemented'
  constraints:
  - 'Trigger: the drag-end event (position capture) for positions; LOD toggle for
    lod changes.'
  - 'Debounce: ~500ms. A second drag within the debounce window replaces the queued
    write (single-flight).'
  - 'After debounce fires: lens file is rewritten atomically via host-side yamlEdit.'
  - 'Self-write suppression: selfWritePath flag MUST be set BEFORE any await on writeFile,
    not after. Setting after-write causes the watcher to fire before the flag is in
    place, producing a reload loop.'
  - 'Visual feedback: transient toast ''Layout saved to lens <name>'' on successful
    write.'
  - 'No dirty buffer: the in-memory lens state IS the authoritative state; on-disk
    is kept in sync.'
- uid: PERSISTENCE.AUTOCREATE
  name: Auto-Create Default Lens
  intent: Define the policy for creating a default lens on first drag when none exists
    so that position persistence works immediately without requiring the user to create
    a lens manually.
  epistemic_state: 'undecided: not yet implemented'
  constraints:
  - 'Trigger: first drag-release event when no lens is currently active.'
  - 'Action: silently create a lens named ''default''; auto-activate it.'
  - 'Sets meta.default_lens: ''default'' in the IG file.'
  - 'Visual feedback: toast ''Created lens default''.'
  - Subsequent drags use the now-active 'default' lens normally via PERSISTENCE.AUTOSAVE.
- uid: DIAGNOSTICS.LENS_BANNER
  name: Lens Diagnostics Banner
  intent: 'Report stale UIDs in applied lenses as a non-blocking banner so the user
    can see which lens entries are outdated without the viewer refusing to render.

    '
  epistemic_state: 'known: implemented in Phase 3.'
  constraints:
  - Banner at bottom of webview. Dismissable.
  - Never blocks rendering. Partial lens application with diagnostics is valid.
  impl_pointers: src/webview/main.ts::showDiagnosticsBanner
- uid: DIAGNOSTICS.EDIT_CONFLICT
  name: Edit Conflict Notification
  intent: 'Surface edit write failures prominently enough that the user cannot miss
    them, preventing the silent data-loss gap between ''user thinks edit was saved''
    and ''edit was silently dropped''.

    '
  epistemic_state: 'risky: current banner is dismissable and easy to miss. User has
    reported edits not being saved. This is the most critical UX failure in the current
    extension.

    '
  constraints:
  - Edit conflict (ok=false) banner is NON-DISMISSABLE until the user explicitly clicks
    Reload.
  - 'Banner includes: error message text, a Reload button that calls loadGraph().'
  - ok=false is logged to the 'IntentGraph' output channel with nodeUid, field, error
    text.
  - 'No optimistic DOM update: the overlay shows pre-edit text until ok=true confirms
    the write.'
  impl_pointers: 'src/webview/main.ts (conflict banner DOM); src/editor/IntentGraphEditorProvider.ts
    (EditFieldRequestType handler)

    '
- uid: DIAGNOSTICS.LOGGING
  name: Output Channel Logging
  intent: 'Route all operational events to the VS Code output channel so developers
    and power users can diagnose issues without opening DevTools.

    '
  epistemic_state: 'undecided: output channel exists but coverage of error events
    is incomplete.'
  constraints:
  - 'Log on: every ok=false response, every fileHash mismatch, every ig-tool subprocess
    error.'
  - 'Log on: file-watcher events (debounced) at verbose level.'
  - 'Log on: lens application with diagnostics list.'
  - 'Channel name: ''IntentGraph''. Created once on extension activation.'
  impl_pointers: src/editor/IntentGraphEditorProvider.ts
- uid: LENSSCHEMA.NODESHAPE
  name: LensNodeEntry Shape
  intent: Define the new LensConfig.nodes value shape so that both lod and optional
    position are stored together per node, reflecting that the lens is the sole store
    for all user-decidable visual state.
  epistemic_state: 'known: design locked. Coord frame switched 2026-05-01 from parent-relative
    to absolute after Path Y investigation: parent-relative restoration was unstable
    due to cytoscape''s compound auto-fit (parent bbox shifts as each child is placed,
    drifting the anchor for subsequent children).'
  constraints:
  - 'Old shape: dict[uid, Literal[''skeleton'',''lean'',''full'']] -- scalar lod string.'
  - 'New shape: dict[uid, LensNodeEntry] where LensNodeEntry = {lod: lod_str, position?:
    {x: float, y: float}}.'
  - position is optional; absent means the node is unpinned (ELK places it freely).
  - position stores absolute coordinates in cytoscape's global frame (Cytoscape node
    CENTER). NOT parent-relative.
  - 'Behavioural intent (the user-facing property): when a parent compound moves between
    sessions or relayouts, its children move with it. This is realised NOT by parent-relative
    storage but by cytoscape''s compound auto-fit: when children are placed at their
    stored absolute positions on apply, the parent''s bounding box auto-fits around
    them. Dragging a parent moves all children (cytoscape default), and each moved
    child''s new absolute position is persisted on free; thus ''children follow parent''
    is preserved end-to-end without a relative coordinate frame.'
  - 'The user-decidable visual state principle: lenses store what the user has explicitly
    chosen; product nodes hold no rendering data.'
  design_notes: 'LensNodeEntry is a Pydantic dataclass in src/src/intentgraph/models/lens_config.py.
    The old scalar shape has no backward-compatible extension path -- a dict value
    cannot be both a string and an object. One-off migration is required (see LENSSCHEMA.MIGRATION).
    Serialization: YAML/JSON round-trip must preserve the new shape. The omission
    rule (SERIALIZATION_FORMAT.md sec 4) applies: position is omitted when None. RATIONALE
    FOR ABSOLUTE STORAGE (Path Y, 2026-05-01): we initially specified parent-relative
    storage to realise the ''children follow parent'' intent. Implementation revealed
    that cytoscape''s compound auto-fit makes anchored restoration unstable -- placing
    a child shifts the parent''s bbox, which shifts the anchor for the next child,
    which compounds the drift. Switching to absolute storage realises the same intent
    more robustly: cytoscape auto-fits parents around restored children, and dragging
    a compound moves all its children (each free fires a per-child autosave), so children
    follow parent both at drag-time and at restore-time. Compounds themselves are
    not positioned (cytoscape pointer §6.3); their bbox is derived. Existing parent-relative
    entries on disk become wrong on switch -- one-off lens cleanup required.'
- uid: LENSSCHEMA.MIGRATION
  name: Fixture Migration Script
  intent: Define the one-off migration that rewrites all existing LensConfig fixtures
    from the old scalar shape to the new LensNodeEntry shape so that existing tests
    and examples remain valid after the schema change.
  epistemic_state: 'known: scope defined; script not yet written'
  constraints:
  - 'Migration logic: for each uid in nodes, wrap the scalar string in {lod: <scalar>}.'
  - Script lives at src/scripts/migrate_lens_config_v2.py. Deleted after merge.
  - 'Targets: src/tests/fixtures/, agents_runtime/tests/fixtures/, vscode_extension/intentgraph-vscode/
    fixtures.'
  - No backward-compatibility shim in production code. Migration is one-time.
- uid: LENSSCHEMA.IGCMDS
  name: New ig-tool Subcommands
  intent: Define the new ig-tool CLI subcommands required to set and clear node positions
    in a lens, so that positions can be managed from the command line and agent scripts.
  epistemic_state: 'known: design locked; not yet implemented'
  constraints:
  - 'New: ig-tool lens set-position -g G --lens N --uid U --x N --y N -- sets or updates
    a position entry.'
  - 'New: ig-tool lens clear-position -g G --lens N --uid U -- removes the position
    entry, reverting to unpinned.'
  - 'Extension: ig-tool lens add-node gains optional --x N --y N flags to set position
    on creation.'
  design_notes: All three subcommands must be documented in TOOL_REGISTRY.md before
    the feature is considered complete.
  impl_pointers: agents_runtime/src/ig_agents/cli_lens_commands.py (alongside other internal
    lens subcommands)
- uid: LENSSCHEMA.VALIDATION
  name: Position Validation Rules
  intent: Define the validation rules for position fields in LensNodeEntry so that
    malformed position data is caught early without over-constraining the schema.
  epistemic_state: 'known: rules defined; not yet implemented'
  constraints:
  - Position x and y must be numeric (float or int) and finite. NaN and Infinity are
    rejected.
  - No parent-rect bounds check at save time. The drag handler enforces bounds during
    interaction; the lens simply trusts the stored values.
  - Validation is implemented in src/src/intentgraph/validation.py as part of
    validate_lenses().
- uid: LENSSCHEMA.SPECDOC
  name: Spec Document Update
  intent: Update LENS_REDESIGN_SPEC.md to reflect the new LensNodeEntry schema, the
    new ig-tool subcommands, and the position validation rules so the spec remains
    the authoritative reference for the lens schema.
  epistemic_state: 'known: scope defined (LensConfig schema change, §4);
    not yet executed'
  constraints:
  - 'Update §4 (LensConfig schema): replace nodes field type with dict[uid, LensNodeEntry].'
  - Add 'Position semantics' subsection citing parent-relative coordinate frame and
    center-MVP rule.
  - 'Update §6 (validation rules): add V-POS1 (position values must be finite numerics)
    and V-POS2 (position fields must use exact keys ''x'' and ''y'').'
  - 'Update §8 (subcommand table): add lens set-position and lens clear-position rows;
    extend lens add-node with optional --x and --y.'
  impl_pointers: foundation_and_formalism/LENS_REDESIGN_SPEC.md
- uid: LENSSCHEMA.VISIBILITY
  name: Lens Visibility Rule
  intent: The set of nodes present in a lens fully determines what is displayed and
    how compounds are shown. Compound expand-vs-collapse state is derived from membership
    of the compound and its children, not stored as an explicit field. The lens is
    the sole source of truth for visible state; LOD on compounds is meaningless for
    visibility.
  epistemic_state: 'known: rule formalised; deriveLensVisibility implementation pending'
  constraints:
  - Node UID present in lens.nodes => the node is displayed.
  - Node UID absent from lens.nodes => the node is not displayed. Renderer realises
    'not displayed' for compounds by collapsing them in the cytoscape view (cytoscape
    always has the full tree mounted; collapse is the closest analogue to 'absent').
  - Compound C in lens AND >=1 of C.children in lens => C is displayed expanded.
  - Compound C in lens AND no C.child in lens => C is displayed collapsed.
  - 'The ''lod'' field on a compound entry has no effect on its expand/collapse state.
    lod is meaningful only for leaves: ''lean'' (default) or ''full'' (overlay shown).'
  - 'Every gesture that mutates visibility (cue collapse, cue expand) must update
    lens.nodes membership accordingly: collapse removes all descendants of the target
    compound; expand adds direct children.'
  - deriveLensVisibility(lensNodeUids, childrenOf) is the canonical pure function
    realising this rule. All visibility decisions across applyLens, gesture handlers,
    and tests consult it.
  - 'New lens default membership: {ROOT, ROOT.children}. ROOT is in lens with its
    direct children also in lens => ROOT renders expanded; each L1 compound is in
    lens but its grandchildren are not => each L1 compound renders collapsed. This
    gives the user the top-level structure as the starting point, not a fully expanded
    graph.'
  - 'Renderer pragmatic (applyLens): the set of compounds to collapse in cytoscape
    is the UNION of (a) collapsedCompoundUids from deriveLensVisibility AND (b) compound
    uids absent from the lens. The pure rule describes intent; the renderer compromises
    ''not displayed'' as ''collapsed'' because cytoscape always mounts the full tree.'
  design_notes: 'This node was added in response to a Bug 1 investigation: cue clicks
    (collapse/expand) and tap-LOD-toggle gestures changed the visible cytoscape state
    but never persisted to disk, so close/reopen reset the visible tree. The fix is
    twofold: (1) the visibility rule lives here as the canonical statement and is
    implemented in src/shared/lensVisibility.ts; (2) gesture handlers send visibility-mutating
    requests to the host (PersistLensVisibilityRequest) which adds/removes lens.nodes
    entries to keep the on-disk lens in sync with the user''s visible-tree intent.
    Rationale for not using a ''lod: skeleton'' marker on compounds: LOD on a compound
    can be overridden by user actions (e.g. promoting a compound to full LOD for inspection)
    and that override should not be conflated with whether the compound is collapsed.
    Membership-only encoding makes the rule local, derivable, and impossible to corrupt
    via LOD changes.'
- uid: LENS_UI.CTRLPANEL.1
  name: Active-Lens Dropdown
  intent: Provide an HTML select element showing all available lenses so the user
    can switch the active lens with a single interaction without the command palette.
  epistemic_state: 'known: implemented. Pick goes through SelectLensRequest
    (Webview → Host) so the host updates entry.activeLensName and broadcasts ApplyLensNotification
    — survives reload.'
  constraints:
  - 'Element: HTML select with one option per lens name plus a ''Default (no lens)''
    option.'
  - Active lens name is reflected in the selector value at all times (set programmatically
    on ApplyLensNotification).
  - onChange handler sends a message to the host to apply the chosen lens (mirrors
    openLens command logic).
  - Selector items are rebuilt on every LoadGraphResponse (file reload may add/remove
    lenses).
  - When no lenses are defined, selector shows 'No lenses defined' and is disabled.
  impl_pointers: src/webview/main.ts (LensSelector.setPickHandler → sendSelectLens);
    src/editor/IntentGraphEditorProvider.ts (SelectLensRequest handler); src/messaging/messageTypes.ts
    (SelectLensPayload, SelectLensRequestType)
- uid: LENS_UI.CTRLPANEL.2
  name: New Lens Button
  intent: Allow the user to create a new named lens directly from the GUI panel without
    switching to the command palette or editing YAML manually.
  epistemic_state: 'known: implemented. ''+'' button prompts for
    a name (window.prompt), validates it (alphanumeric + _ -), sends CreateLensRequest.
    Host runs createLens (lensCrud.ts), the file change triggers a reload, and the
    new lens auto-activates.'
  constraints:
  - 'Control: ''+'' button. On click: prompts user for a lens name (VS Code input
    box or inline input).'
  - 'On confirm: sends CreateLensRequest to host; host runs ig-tool lens create and
    reloads.'
  - 'New lens is auto-activated after creation. Toast shown: ''Created lens <name>''.'
  - If the name already exists, show an error (no duplicate lens names).
  impl_pointers: src/webview/main.ts::App.handleCreateLens; src/host/lensCrud.ts::createLens;
    src/messaging/messageTypes.ts (CreateLensPayload, CreateLensRequestType)
- uid: LENS_UI.CTRLPANEL.3
  name: Rename Active Lens
  intent: Allow the user to rename the currently-active lens inline so that lens names
    can be kept meaningful as the design evolves.
  epistemic_state: 'known: implemented. Pencil button is enabled
    only when a lens is active. window.prompt seeds the new name with the current
    one. Host renames the lens key + the lens.name field + meta.default_lens if applicable.'
  constraints:
  - 'Control: pencil icon. On click: enters inline rename mode on the dropdown label.'
  - 'On confirm: sends RenameLensRequest to host; host updates the lens key in the
    IG file.'
  - meta.default_lens is updated if the renamed lens was the default.
  - Active lens name in PanelEntry is updated to the new name.
  impl_pointers: src/webview/main.ts::App.handleRenameLens; src/host/lensCrud.ts::renameLens;
    src/messaging/messageTypes.ts (RenameLensPayload, RenameLensRequestType)
- uid: LENS_UI.CTRLPANEL.4
  name: Delete Active Lens
  intent: Allow the user to delete the currently-active lens with a confirmation step
    so that accidental deletions are prevented and the active state is always valid.
  epistemic_state: 'known: implemented. Trash button is enabled only
    when a lens is active. window.confirm gate before delete. Host removes the lens
    entry, unsets meta.default_lens if needed, and clears active state if the deleted
    lens was active.'
  constraints:
  - 'Control: trash icon. On click: shows a confirmation dialog before deleting.'
  - 'On confirm: sends DeleteLensRequest to host; host removes the lens from the IG
    file.'
  - If the deleted lens was meta.default_lens, unset default_lens in the IG file.
  - After deletion, if the deleted lens was active, switch to 'no lens active' state.
  - Dropdown rebuilds to reflect the remaining lenses.
  impl_pointers: src/webview/main.ts::App.handleDeleteLens; src/host/lensCrud.ts::deleteLens;
    src/messaging/messageTypes.ts (DeleteLensPayload, DeleteLensRequestType)
