- uid: PERSISTENCE.IG_FILE
  name: IG File Writes
  intent: 'Define what types of changes are written back to the IG YAML file and how,
    so that the IG file remains the single source of truth for all persistent graph
    content.

    '
  epistemic_state: 'observed | gap: edit-save silent-failure fix pending; see EDITING.PERSISTENCE
    for UX contract and fix scope.'
  constraints:
  - Only field text edits (name, intent, constraints) are written to the IG file.
  - Write uses parseDocument (eemeli/yaml CST-preserving) + setIn paths + toString
    + writeFile.
  - SHA-256 file hash is checked before every write. Mismatch produces ok=false; no
    write occurs.
  - ig-tool validate is run before the final write when validateOnWrite setting is
    true.
  - File-watcher reload triggered by the write is suppressed via selfWritePath flag.
  impl_pointers: src/host/yamlEdit.ts; src/host/fileHash.ts
- uid: PERSISTENCE.POSITIONS
  name: Node Position Persistence
  intent: Define that manually-dragged node positions are stored in the active lens
    entry so that the user's layout work is git-trackable, shareable, and survives
    reload.
  epistemic_state: 'known | risky: position stored as Cytoscape node center; visual
    stability under LOD toggle not yet measured | unvalidated: center-vs-top-left
    UX tradeoff not yet validated'
  constraints:
  - 'Coordinate frame: parent-relative (A2). Each node''s position is (x, y) offset
    from parent top-left. ROOT position is implicit (0,0); never stored.'
  - 'Storage: lens entry position field -- {x: N, y: N} -- as Cytoscape node CENTER.
    Matches cy.node.position() API natively.'
  - 'On drag-release: position is captured from cy.on(''free'') and written to the
    active lens via auto-save (PERSISTENCE.AUTO_SAVE).'
  - Children cannot exit parent compound rect. Drag handler clips during drag; snaps
    back on release if outside. Layout algorithm is not responsible for enforcement.
  - 'Children of collapsed parent: positions remain stored in lens, just not rendered.'
  - 'On structural reload: positions for UIDs still present are restored; positions
    for removed UIDs are dropped.'
  design_notes: 'Position MVP stores the Cytoscape node CENTER (not top-left). Reason:
    matches cy.node.position() API directly with no boundary conversion required.
    Tradeoff: LOD changes shift the visible rect around the stored center, which can
    be visually jarring on toggle. Acceptable for MVP. If UX issues emerge, a future
    iteration can switch to storing top-left by converting: top-left = center - (width/2,
    height/2). This supersedes the old Option A (workspaceState) vs Option B (data_registry)
    debate. Decision is locked: positions live in the lens schema (extension of Option
    B, lens as carrier).'
  impl_pointers: src/webview/interaction/gestureRouter.ts::wireDragGestures (cy.on('grab')
    + cy.on('free')); src/host/yamlEdit.ts (yamlEdit invoked downstream of autosavePersistPosition);
    src/host/autosave.ts (parseAndMutateLensPosition, createDefaultLens)
