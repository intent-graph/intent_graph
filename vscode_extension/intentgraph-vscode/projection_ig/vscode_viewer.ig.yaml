meta:
  name: vscode_viewer ProjectionIG
  description: 'Projection intent governing how IntentGraphs are rendered and edited
    inside the VS Code custom editor panel (vscode_viewer); applies to any product
    IG opened via the intentgraph-vscode extension.

    '
  kind: projection_ig
nodes:
- uid: ROOT
  name: vscode_viewer Projection
  intent: 'Govern every rendering, interaction, editing, and persistence decision
    for the vscode_viewer so that any agent or developer can derive correct behaviour
    from this graph alone, without reading external docs or source comments.

    '
  epistemic_state: 'known: development closed the major gaps that the prior epistemic state
    called out. INTERACTION.{GESTURES,MODES,DRAG,FOCUS,ROUTER}, LAYOUT.{CUES,OVERLAY},
    EDITING.{ENTER,SCOPE,EXIT,PERSISTENCE}, LENS_UI.CTRLPANEL.{1,2,3,4}, and PERSISTENCE.{POSITIONS,AUTOSAVE,AUTOCREATE}
    are implemented and exercised; remaining `gap:` annotations are deferred items
    (live drag clipping, per-compound layout) and NOT regressions.'
  constraints:
  - No vscode.* API may be used inside the webview bundle.
  - No cytoscape or elkjs may be imported in the extension host.
  - 'Content Security Policy: no inline scripts; no eval; no blob: URIs for scripts.
    Only listed CDN/local sources allowed. Unchanged from earlier locked policy.

    '
  - Intent is source of truth (P1); vscode_viewer is a projection, not the canonical
    model.
  impl_pointers: src/editor/IntentGraphEditorProvider.ts (host boundary); src/webview/main.ts
    (webview entry)
  history:
  - who: agent:ig-designer-agent
    date: '2026-04-27'
    note: Initial PIG authored from early design docs and user feedback.
- uid: AUDIENCE
  name: Primary Audience
  intent: 'Identify who uses vscode_viewer and what they need from it, so that every
    rendering and interaction decision has a clear user to satisfy.

    '
  epistemic_state: known
  constraints:
  - 'Two roles: architect (reads/edits the graph) and agent reviewer (validates agent
    output).'
  - 'Both roles need to read intent text at full LOD without eyestrain; both may submit
    text edits; neither uses the viewer for structural graph authoring (that is ig-tool''s
    job).

    '
  design_notes: 'Structural authoring (add/remove nodes, reparent) is deliberately
    excluded from vscode_viewer scope (Phase 1/2 boundaries). Edits are confined to
    field text so the viewer is not an alternative to ig-tool but a companion to it.
    Projection-side rationale: rendering choices (text size, color contrast, no-jargon
    diagnostics) are derived from these user descriptions; AUDIENCE is present here
    to motivate those rendering decisions, not to duplicate product IG content.'
- uid: OPERATIONS
  name: User Operations
  intent: 'Define the five primitive operations the user can perform inside vscode_viewer,
    so that interaction design and keyboard shortcuts can be derived from a closed
    vocabulary.

    '
  epistemic_state: known
  constraints:
  - 'Operations: Read (navigate, inspect), Navigate (pan/zoom, expand/collapse), Toggle
    LOD, Edit (enter/commit/cancel), Apply Lens, Manage Lens (create/rename/delete).'
  - 'Persist View is implicit: positions and lens changes are saved; pan/zoom is ephemeral.'
  - No operation may leave the IG file in an inconsistent state.
- uid: INTERACTION
  name: Interaction Model
  intent: 'Define the gesture vocabulary, the two modes (view vs edit), and the focus
    rules so that the user always knows what a click/double-click/drag will do.

    '
  epistemic_state: 'observed | risky: tap-suppression race in the double-click/drag gesture handling'
  constraints:
  - 'Four verbs: single-click (LOD toggle), double-click (enter edit), drag (reposition
    node), click-control (lens control panel actions).'
  - Edit mode and view mode are mutually exclusive; the mode a node is in must be
    visually obvious.
  impl_pointers: 'src/webview/cyMount.ts (gesture wiring: wireTapLOD, wireDblTapEdit)'
- uid: LAYOUT
  name: Visual Layout
  intent: 'Define the layout model: ELK as the sole layout engine, the three LOD tiers
    with their pixel contracts, the overlay transform system, expand/collapse invariants,
    and the layout algorithm strategy, so that visual dimensions and algorithm choices
    are never scattered across ad-hoc constants.'
  epistemic_state: 'known | unvalidated: full-LOD dimension in code (320x360 Amend
    4) must be updated to canonical 240x180 before next build'
  constraints:
  - ELK runs once at structural mount. No relayout on LOD toggle or lens apply.
  - 'Rect dimensions are derived (never stored): rect = f(lod, collapse-state-of-self,
    collapse-state-of-descendants).'
  - Tier defaults are canonical in LAYOUT.RECT data_registry. No dimension literal
    in rendering code.
  impl_pointers: src/webview/elkBridge.ts (LEAF_WIDTH, LEAF_HEIGHT, FULL_LOD_WIDTH,
    FULL_LOD_HEIGHT)
- uid: EDITING
  name: Bidirectional Editing
  intent: 'Define the complete edit lifecycle -- entry, scope, exit, and write-back
    -- so that field edits in the viewer always reach the IG YAML file reliably.

    '
  epistemic_state: 'observed | gap: edit-save silent failure diagnosed.
    Root cause is fileHash mismatch producing ok=false with no visible feedback. Exit
    condition (''click outside whole node'') partially implemented via blur but glitchy
    per user report.

    '
  constraints:
  - Edit mode entry is via double-click only (INTERACTION.GESTURES).
  - 'ALL fields of a node (name, intent, constraints array) are editable simultaneously
    in one unified form. NOT field-by-field sequential editing. User: ''All the content
    of the detailed node should be editable in the same edit mode.''

    '
  - A single atomic write (EditNodeRequestType) commits all changed fields at once.
  - DOM must NOT be updated optimistically. Fields update only after ok=true from
    host.
  - 'On ok=false: revert overlay fields to pre-edit values; display non-dismissable
    error banner.'
  impl_pointers: 'src/messaging/messageTypes.ts::EditNodeRequestType; src/host/yamlEdit.ts;
    src/webview/overlay/htmlOverlayLayer.ts

    '
- uid: LENS_UI
  name: Lens Control Panel
  intent: Provide a persistent lens control panel in the top-right of the webview
    panel so that users can manage lenses (switch, create, rename, delete) and always
    see the active lens without using the command palette.
  epistemic_state: 'known: control panel implemented across PIG LENS_UI.CTRLPANEL.{1,2,3,4}.
    Top-right panel with dropdown + three action buttons; always present; CRUD synchronous
    with the IG file via the new lensCrud.ts module.'
  constraints:
  - Control panel is always present in the top-right of the webview panel. Z-index
    above graph canvas.
  - 'Panel max-height: 40px. Controls laid out horizontally.'
  - Rendered before cy init; does not depend on Cytoscape being ready.
  - Panel is always visible when the viewer is open (not gated on lens count).
  - 'Panel contains: active-lens dropdown, New (+), Rename (pencil), Delete (trash)
    controls.'
  - No Save or Discard buttons -- auto-save model applies (PERSISTENCE.AUTO_SAVE).
  - Existing diagnostics banner remains in its current bottom position.
  design_notes: The user explicitly rejected lenses being called 'projections' in
    the strict P4 sense. Lenses are view configuration -- selection + per-node visual
    choices (lod, position). The control panel surfaces this view-configuration UX
    directly in the GUI.
  impl_pointers: 'src/webview/main.ts (lens selector DOM -- to be added); src/editor/IntentGraphEditorProvider.ts::openLens

    '
- uid: PERSISTENCE
  name: Persistence Policy
  intent: Define precisely what is saved where (lens entry vs workspaceState vs in-memory)
    so that nothing is silently lost and nothing pollutes the wrong storage tier.
  epistemic_state: 'known | gap: AUTOSAVE and AUTOCREATE not yet implemented; POSITIONS
    schema requires LENSSCHEMA upstream changes first; edit-save silent-failure fix
    pending (see children)'
  constraints:
  - 'IG file: field text edits only. Canonical, git-tracked, shareable.'
  - 'Lens (inside IG file): per-node lod, per-node position (x, y). User-decidable
    visual state.'
  - 'workspaceState: ephemeral pan/zoom only. Nothing else.'
  - 'In-memory (PanelEntry): active lens name; active fileHash; selfWritePath flag.'
  - Lens carries a list of which intentlinks are visible (per existing LensConfig.intentlinks
    field); not all intentlinks are shown in every lens.
  design_notes: Lenses are view configuration -- user-decidable visual state (lod,
    position). They are NOT projections in the strict P4 sense (no content transformation,
    just selection + per-node visual choices). The vscode_viewer ITSELF remains a
    real ProjectionIG (it projects the IG into a GUI). Lens = view configuration.
    Viewer = projection. Pan/zoom stays in workspaceState as ephemeral per D16 of
    LENS_REDESIGN_SPEC.
- uid: DIAGNOSTICS
  name: Diagnostics and Logging
  intent: 'Define how the extension surfaces errors, warnings, and debug information
    to the user and to developers so that silent failures are eliminated.

    '
  epistemic_state: 'observed | gap: edit ok=false responses not logged to output channel;
    conflict banner too easily dismissed | undecided: DIAGNOSTICS.LOGGING coverage
    of error events incomplete'
  constraints:
  - All ok=false responses from host operations MUST be logged to the extension output
    channel.
  - 'Extension output channel name: ''IntentGraph''. Created once on extension activation.'
  - User-facing errors use non-dismissable banners in the webview panel.
  - Non-blocking warnings use dismissable banners.
  impl_pointers: src/editor/IntentGraphEditorProvider.ts (output channel); src/webview/main.ts
    (banner DOM)
- uid: NON_GOALS
  name: Explicit Non-Goals
  intent: 'Record what vscode_viewer will NOT do so that future sessions do not add
    these features under pressure and so scope creep has a named boundary.

    '
  epistemic_state: known
  constraints:
  - No lens diff/merge UI. Lens content is edited via ig-tool or direct YAML.
  - No agent dialogue UI (no chat pane, no elicitor integration).
  - No reintegrate UI (reduced-IG sync back to parent). Use ig-tool lens reintegrate.
  - No add/remove/reparent nodes from the GUI (Phase 1/2 boundary).
  - No WebGL renderer. Canvas renderer is locked (dashed edges require canvas).
  - No web-worker elkjs (deferred to a future wave for large graphs).
  - No WebviewPanelSerializer for cross-session state restore (deferred).
- uid: INVARIANTS
  name: Cross-Cutting Invariants
  intent: 'Enumerate the rules that apply across all subsystems and that nothing may
    break, so that any change can be validated against a single checklist.

    '
  epistemic_state: known
  constraints:
  - 'INV-1: No vscode.* API in the webview bundle.'
  - 'INV-2: No cytoscape or elkjs imports in the extension host.'
  - 'INV-3: CSP -- no inline scripts, no eval, no blob: script sources.'
  - 'INV-4: No relayout on LOD toggle. ELK runs once at structural mount only.'
  - 'INV-5: Intent is source of truth. The IG file is canonical; viewer state is derivative.'
  - 'INV-6: No optimistic DOM update for edits. Write must succeed before DOM changes.'
  - 'INV-7: Overlay visibility is coupled to node visibility. An overlay must never
    be visible when its node is not visible.'
  - 'INV-8: Lens is the only store for user-authored visual state. Product nodes hold
    no rendering data. Positions and LOD assignments belong exclusively in LensConfig.nodes
    entries.'
  - 'INV-9: A compound node''s collapsed/expanded state changes only as a result of
    (a) the user clicking the cue handled by CueLayer, or (b) programmatic state restoration
    when a Lens is applied or a structural reload restores prevCollapseSet. No other
    code path may trigger it (no drag, no overlap, no selection, no library-internal
    handler, no LOD toggle).'
- uid: LENSSCHEMA
  name: IG-Core Lens Schema Changes
  intent: Capture the upstream IG-core changes required to support positions in lens
    entries, so that the implementation scope is explicit before any IG-core agent
    is dispatched.
  epistemic_state: 'known: scope defined; implementation not started | gap: L1 UID
    rename (LENSSCHEMA -> IGCORE) deferred -- rename cascades through 5 child UIDs
    and 1 intentlink; diff cost exceeds LOW-priority benefit'
  constraints:
  - All changes are in src and agents_runtime. The vscode_viewer does not own these
    changes.
  - The new LensNodeEntry shape is not backward-compatible with the old scalar lod-string
    shape.
  - A one-off migration script rewrites all test fixtures before merge.
  design_notes: The user-decidable visual state principle requires the lens schema
    to carry both lod and position. The current LensConfig.nodes shape (dict[uid,
    lod_str]) stores only lod. This must be widened to dict[uid, {lod, position?}]
    so that positions can travel alongside lod in the same entry.
- uid: OBSERVABILITY
  name: Session Trace Observability
  intent: 'Guarantee that any panel session is reconstructible from disk after the

    fact, by emitting a structured causality trace as the extension runs.

    A reader (human, or AI agent on a later turn) can `tail` the latest

    JSONL log and reconstruct what the extension actually did — which

    gestures fired, which suppression decisions ran, which compound

    transitions originated where, which reloads the file watcher

    triggered, whether the lens menu mounted at all. The product is

    observable by construction; bug reports become diagnosable from

    disk evidence rather than from re-running the extension and hoping

    to reproduce the symptom.

    '
  epistemic_state: 'known: implemented across the initial trace layer
    and a later pass adding the writeIgFile wrapper + content-hash reload gate + lifecycle hardening.
    All eight constraints have landed in code. Test count 138/138; all four product-contract
    assertions in test/unit/trace.test.mjs pass.'
  constraints:
  - Every state-machine transition (LOD per node, Compound per parent, Mode global)
    emits a trace entry tagged with the transition's cause and a correlation id where
    causation crosses event boundaries.
  - Every ec.expand / ec.collapse / ec.expandRecursively / ec.collapseRecursively
    call goes through a single wrapper (src/webview/overlay/ecWrap.ts) that logs the
    caller and the cause. Direct calls outside the wrapper are forbidden — this enforces
    INVARIANTS INV-9 via the trace shape, not just the comment.
  - 'Every reload boundary (file watcher fire, applyLens, structural rebuild) logs
    its reason. Reloads pass through THREE gates in order: (1) selfWritePath suppression
    (existing); (2) content-hash gate — if the file''s SHA-256 matches entry.lastLoadedFileHash,
    the reload is suppressed and a kind:''reloadSuppressed'' entry with cause:''contentUnchanged''
    is emitted; (3) if both fall through, a fresh corr is generated, stamped on entry.pendingReloadCorr,
    and emitted with kind:''reload'' so the LoadGraph handler''s applyLensReinstate
    references the same corr.'
  - Every file write to the IG path goes through src/host/diskWrite.ts::writeIgFile,
    which emits a kind:'fileWrite' entry with cause:<helper-name> (e.g. 'autosave.parseAndMutateLensPosition',
    'lensCrud.createLens', 'yamlEdit.applyFieldEdit'). Direct fs.writeFile calls to
    the IG path outside this wrapper are forbidden. Catches reload-loop sources because
    the trace shows which helper fires the periodic write.
  - Lifecycle markers fire on router / cueLayer / lensSelector mount with cardinality
    (compoundCount, buttonCount) so 'didn't mount' is detectable from the trace alone.
    initTrace() runs in the App constructor BEFORE LensSelector is constructed so
    the lensSelectorMounted entry is captured.
  - Trace path is configurable via intentgraph.trace.path; default lives at <workspace>/.intentgraph-traces/
    and falls back to <extension-dir>/test/traces/ if no workspace folder is open.
    Latest session symlinked as latest.jsonl for tail-friendly access (regular-file
    copy fallback on systems without symlink support). The sessionStart entry includes
    the resolved traceDir, traceFile, and pathSource so a reader can confirm at a
    glance which directory the trace landed in.
  - 'Trace is ON BY DEFAULT. User can disable per-workspace via setting intentgraph.trace.enabled:
    false. Automatic rotation: keep the last 5 sessions, delete older. Two commands
    available: intentgraph.trace.toggle (flips workspace setting), intentgraph.trace.mark
    (prompts for label, emits a marker entry).'
  - 'Trace format is JSONL with a documented schema, versioned (schemaVersion: 1,
    embedded in the sessionStart entry). Each entry carries: ts (ISO RFC 3339), seq
    (monotonic per-panel — separate webview-side and host-side counters), src (one
    of router|cue|overlay|host|lens|app), kind (lowerCamelCase), cause (when not implied
    by kind), corr (correlation id, used across the dbltap→editEnter→pointerdown chain,
    the cueClick→ecCall chain, and the watcher→reload→applyLensReinstate chain).'
  - 'Session boundaries: sessionStart entry on TraceSink construction (with schemaVersion,
    pid, vscodeVersion, traceDir, pathSource, traceFile); sessionEnd entry on close()
    so a reader can distinguish a clean shutdown from a trace cut off mid-event.'
  - 'Test invariant: test/unit/trace.test.mjs includes (a) a schema check on a representative
    trace fixture, (b) a sequence-sanity test that asserts a known gesture produces
    the expected corr-linked event chain, (c) a grep test that asserts every ec.expand
    / ec.collapse callsite in src/ goes through the wrapper, and (d) the rotation
    pure helper. Absence of telemetry is a build failure, not a silent regression.'
  design_notes: "OBSERVABILITY vs DIAGNOSTICS — they are siblings, not parent/child.\
    \ DIAGNOSTICS\nsurfaces errors to the user (banners, output channel) at human\
    \ timescale.\nOBSERVABILITY emits structured causality traces to disk for developer/agent\n\
    consumption at machine timescale. Different audience, different storage,\ndifferent\
    \ retention.\n\nEvent surface — covered by current implementation:\n  - router:\
    \ tap (with suppression reason if early-return), dbltap (generates\n    corr),\
    \ document-level pointerdown (with targetInCard / targetInChrome /\n    commitDecision),\
    \ keydown Escape (only when something is editing),\n    grab, free (with wasActualDrag\
    \ and snap-back outcome).\n  - cue: cueLayerMounted (with compoundCount); cueClick\
    \ (passes corr into\n    the ec wrapper, so the resulting ecCall entry references\
    \ the same corr).\n  - overlay: editEnter (receives corr from caller), editCommit\
    \ (with\n    fieldsChanged count, hostOk, error if any), editCancel.\n  - host:\
    \ ecCall (centralised wrapper, with method+caller+cause),\n    fileWrite (every\
    \ IG file write with cause+bytes+tmp+selfWritePathSet),\n    reload (reason +\
    \ selfWritePath verdict + content-hash gate result +\n    corr), reloadSuppressed\
    \ (cause: selfWritePathMatch | contentUnchanged),\n    applyLensReinstate (carries\
    \ the reload's corr), every lens CRUD message.\n  - lens: lensSelectorMounted\
    \ with cardinality of buttons found (the bug-3\n    diagnostic — if buttons aren't\
    \ found, the trace says so explicitly);\n    every pick / CRUD action with host\
    \ result.\n  - markers: sessionStart (with schemaVersion + traceDir + pathSource),\n\
    \    sessionEnd, manual user-invoked mark via command palette\n    (intentgraph.trace.mark).\n\
    \nAnti-instrumentation (what NOT to log): tickAll (60 fps render noise),\nindividual\
    \ overlay show/hide (deterministic from logged taps), drag deltas\n(only grab/free\
    \ bookend), isCollapsible / isExpandable reads (no state\nmutation). Smart instrumentation\
    \ captures causality, not events.\n\nThe content-hash reload gate\
    \ is the most architecturally\nimportant addition. macOS FSEvents and VS Code's\
    \ FileSystemWatcher fire\non metadata-only events; without a content gate, every\
    \ fire triggered a\nstructural reload, which itself ran applyLens and could write\
    \ the file,\nwhich fired the watcher again — a feedback loop. The gate reads the\
    \ file,\ncomputes SHA-256, and compares to entry.lastLoadedFileHash; if they\n\
    match, the reload is silently suppressed and a kind:'reloadSuppressed'\nentry\
    \ with cause:'contentUnchanged' is emitted instead. This is the\ndefensive layer\
    \ — the right thing regardless of why the watcher fires.\n\nJSONL line examples\
    \ (canonical schema):\n{\"schemaVersion\":1,\"ts\":\"2026-04-30T11:34:01.123Z\"\
    ,\"seq\":0,\"src\":\"host\",\"kind\":\"sessionStart\",\"data\":{\"pid\":67799,\"\
    vscodeVersion\":\"1.118.1\",\"traceDir\":\"/path/.intentgraph-traces\",\"pathSource\"\
    :\"workspaceFolder\",\"traceFile\":\"/path/.intentgraph-traces/trace-2026-04-30T11-34-01Z.jsonl\"\
    }}\n{\"ts\":\"2026-04-30T11:34:02.456Z\",\"seq\":12,\"src\":\"router\",\"kind\"\
    :\"dbltap\",\"corr\":\"c-12-a3f7\",\"data\":{\"uid\":\"DISCOVER\",\"currentLod\"\
    :\"lean\",\"action\":\"promoteThenEdit\"}}\n{\"ts\":\"2026-04-30T11:34:03.001Z\"\
    ,\"seq\":3,\"src\":\"host\",\"kind\":\"reloadSuppressed\",\"data\":{\"reason\"\
    :\"watcher\",\"uri\":\"/path/file.ig.yaml\",\"cause\":\"contentUnchanged\",\"\
    hashPrefix\":\"d41d8cd98f00\"}}\n\nRotation: on TraceSink construction, scan the\
    \ trace dir; if more than 5\ntrace-*.jsonl files exist, delete the oldest until\
    \ 5 remain. The\nlatest.jsonl symlink points at the current file for tail-friendly\n\
    access; on systems where symlinks aren't available, fall back to a\nregular-file\
    \ copy at session close.\n"
  impl_pointers: src/host/trace.ts (TraceSink — path resolution, append queue, rotation,
    sessionStart/End markers); src/host/diskWrite.ts (writeIgFile + registerTraceSink
    — every IG file write goes through here); src/webview/trace.ts (webview emitter
    with monotonic seq + corr helper); src/webview/overlay/ecWrap.ts (single wrapper
    for all four ec methods); src/editor/IntentGraphEditorProvider.ts (scheduleReload
    with the three-gate reload pipeline + content-hash gate; PanelEntry.lastLoadedFileHash
    + pendingReloadCorr); test/unit/trace.test.mjs (schema, sequence, rotation, grep
    invariant).
- uid: INTERACTION.GESTURES
  name: Gesture Vocabulary
  intent: 'Enumerate every recognised pointing gesture and what it does in each mode,
    so that no gesture is ambiguous and the three-verb contract is enforced in one
    place.

    '
  epistemic_state: known
  constraints:
  - Single-click on a node body in view mode toggles LOD between lean and full.
  - Double-click on a node body enters edit mode. If the node is currently lean, the
    LOD machine first transitions it to full; the Mode machine then enters edit on
    the next render frame (single coherent action, no intermediate user step required).
  - Drag on any node in view mode repositions the node; the drag-end event captures
    the new position.
  - Click on the cue (LAYOUT.CUES) is the EXCLUSIVE trigger for compound expand/collapse;
    no other gesture or event may invoke it (see INVARIANTS INV-9).
  - No gesture is valid on a node that is in edit mode except a click outside its
    overlay (which exits edit mode) or Escape (which cancels).
  - 'Tap-vs-dbltap suppression is state-based, not timing-based. The Mode machine''s
    editingUid (set by dbltap before Cytoscape fires the trailing synthetic taps)
    is the single source of truth: any tap arriving while editingUid is set for the
    tapped node is ignored by the LOD-toggle handler.'
  - Single-click LOD toggle and drag-release both fire the PERSISTENCE.AUTOSAVE debounce.
  design_notes: 'Router refactor: timing-based 350ms dbltap suppression window
    replaced by explicit state guard (editingUid check). Cytoscape fires `dbltap`
    BEFORE the trailing synthetic `tap` events, so dbltap can set state.editingUid
    first; subsequent taps see editingUid set for that node and skip. Dbltap-on-lean
    is now a coherent promote-then-edit instead of a no-op.'
  impl_pointers: src/webview/interaction/gestureRouter.ts (single owner of all five
    gestures); src/webview/cyMount.ts (thin adapter retained only for cy mount + dispose)
  data_registry:
    timings:
      dbltap_suppression_ms: 350
      fit_animation_ms: 250
      drag_debounce_ms: 500
- uid: INTERACTION.MODES
  name: Node State Machines
  intent: 'A node''s visible behavior is governed by three orthogonal binary state

    machines: LOD (lean / full), Compound state (collapsed / expanded),

    and Mode (view / edit). Every pointer event must resolve to a

    transition in exactly one of these, with no cross-talk. Without this

    separation, the same event (a tap on a compound parent) is ambiguous

    and the UI becomes non-deterministic.

    '
  epistemic_state: 'known: three orthogonal machines (LOD / Compound / Mode) specified.
    Router pending — src/webview/interaction/gestureRouter.ts introduces
    the single owner of cy and document-level event listeners; explicit state guards
    replace timing-based suppression.'
  constraints:
  - 'LOD machine (per node): lean and full are exclusive. Default is lean. Transition:
    single-click on node body in view mode.'
  - 'Compound machine (per compound node only): collapsed and expanded are exclusive.
    Default is collapsed. Transition: click on the cue (LAYOUT.CUES). No other event
    may transition this machine (INVARIANTS INV-9).'
  - 'Mode machine (global, at most one node in edit mode): view and edit are exclusive.
    Default is view. Transition into edit: double-click on a full-LOD node body. Transition
    out of edit: click outside the editing node''s overlay, or Escape.'
  - 'Orthogonality: the three machines transition independently. A LOD transition
    does not change Compound state. A Compound transition does not change LOD. Entering
    edit mode does not change LOD or Compound.'
  - Only one node may be in edit mode at any time. While a node is in edit mode, all
    gesture handlers that would transition any machine for that node are suppressed
    except the exit transition.
  - On edit-mode entry, the camera centers on the node (see INTERACTION.FOCUS).
  examples:
  - 'Lean -> full: single-click on a leaf node in view mode flips its LOD to full.
    Compound state unchanged. Mode unchanged.'
  - 'Expanded -> collapsed: click the cue on an expanded compound. Compound state
    flips. LOD of that node unchanged. Mode unchanged.'
  - 'View -> edit: double-click on a full-LOD node. Mode becomes edit for that node.
    LOD unchanged. Compound state unchanged.'
  - 'Forbidden: a drag that overlaps another compound node MUST NOT collapse or expand
    the dragged-onto node. Forbidden: a single click on a compound''s body MUST NOT
    collapse or expand it (only the cue does that).'
  impl_pointers: 'src/webview/cyMount.ts::wireDblTapEdit; src/webview/overlay/htmlOverlayLayer.ts::enterEditModeAtPoint;
    src/webview/main.ts (onEditCommit wiring, lines ~506-526)

    '
- uid: INTERACTION.FOCUS
  name: Camera Focus Rules
  intent: 'Define when and how the graph canvas recenters automatically so that the
    user always has context without manual panning.

    '
  epistemic_state: 'undecided: camera-center on edit-mode entry is specified but not
    yet implemented'
  constraints:
  - 'On first load: cy.fit() to show the full graph with 40 px padding.'
  - 'On edit-mode entry: camera animates to center the editing node. Duration = /timings/fit_animation_ms.'
  - 'On edit-mode exit: camera restores to the pan/zoom state that existed before
    entry.'
  - 'On lens apply: camera fits the nodes included in the lens.'
  - 'On structural reload: viewport is restored to the pre-reload snapshot (pan +
    zoom).'
  impl_pointers: src/webview/cyMount.ts (cy.fit call); src/webview/state.ts (viewport
    snapshot)
- uid: INTERACTION.DRAG
  name: Drag Gesture Spec
  intent: Define the drag gesture lifecycle from pointer-down to position-stored so
    that the interaction, layout, and persistence subsystems share one unambiguous
    contract.
  epistemic_state: 'known: drag persistence migrated into the gesture router.
    Edit-mode suppression now reads state.editingUid (any node editing
    → all drags suppressed) instead of the prior uiPhase heuristic, removing a class
    of races where stale uiPhase let drag fire during edit.'
  constraints:
  - Drag is only active in view mode. Drag on a node in edit mode is suppressed.
  - Drag starts on any node (lean or full) in view mode.
  - 'During drag: children cannot leave the parent compound rect. Clip to parent bounds
    in the drag handler.'
  - 'On release: the drag-end event fires. Position is captured from the node''s center
    coordinates.'
  - 'On release: if position is outside parent compound rect, snap node back to last
    valid position.'
  - Position capture fires PERSISTENCE.AUTOSAVE debounce. If no lens is active, PERSISTENCE.AUTOCREATE
    runs first.
  - 'Actual-drag detection: only fire PERSISTENCE.AUTOSAVE on actual drag (grab→free
    position delta exceeds 1px threshold). Click-without-move must NOT trigger a write
    to prevent spurious reload loops.'
  design_notes: 'Implemented via cy.on(''grab'') + cy.on(''free'')
    in the

    gesture router. Position captured via cy.node.position() (Cytoscape

    center, parent-relative coordinate frame). Actual-drag guard via

    wasActualDrag(startPos, endPos, threshold=1px) — exported from the

    router for testability and to mirror the prior wave''s helper. Edit-mode

    suppression reads state.editingUid; click-without-move (movement < 1px)

    does not trigger AUTOSAVE.

    '
  impl_pointers: src/webview/interaction/gestureRouter.ts::wireDragGestures (grab
    + free listeners, snap-back, wasActualDrag guard); src/editor/IntentGraphEditorProvider.ts::autosavePersistPosition
    (host-side debounce + selfWritePath ordering)
- uid: INTERACTION.ROUTER
  name: Gesture Router Dispatch Contract
  intent: 'Centralize ownership of every cy and document-level pointer/keyboard

    listener in a single module so that gesture dispatch is auditable, testable,

    and free of cross-handler races. The router is the only place the three

    orthogonal state machines (PIG INTERACTION.MODES) transition.

    '
  epistemic_state: 'known: contract specified early; implementation lands
    across later development'
  constraints:
  - 'Single owner: one GestureRouter instance per panel mount holds every cy.on listener
    (tap, dbltap, grab, free) and every document-level listener (pointerdown, keydown).
    No other module may attach Cytoscape pointer listeners or document-level pointer
    listeners.'
  - 'Single state object: one GestureState (src/webview/interaction/state.ts) per
    router. nodeLOD Map, collapseSet Set, editingUid scalar, grabPosition Map. All
    suppression checks read from this object, never from timing windows or DOM probes.'
  - Compound transitions originate exclusively from cue clicks or programmatic restoration
    (applyLens, clearLens, structural reload). The router exposes a CompoundTransitionSource
    discriminator so callers cannot spoof user clicks.
  - 'Mode transitions: enter on dbltap-on-node-body; exit on pointerdown outside the
    editing card OR Escape OR another node entering edit (auto-commits prior). Tab
    navigation between fields inside the editing card MUST NOT trigger exit (containment
    check, not blur).'
  - 'Disposal: router.dispose() detaches every listener it attached. Idempotent. Called
    from CyHandle.dispose.'
  design_notes: 'Router replaces wireTapLOD / wireDblTapEdit / wireDragPersist (cyMount.ts)

    and the orphaned document-level click-outside handler (commented in main.ts:20

    but never wired). Earlier attempts tried to fix the cue and edit

    regressions by adding parallel mechanisms; the router collapses them back

    to a single dispatch path so future dispatches cannot fork the contract again.

    '
  impl_pointers: src/webview/interaction/gestureRouter.ts; src/webview/interaction/state.ts
- uid: LAYOUT.LOD
  name: LOD Tier Definitions
  intent: 'Define what content is visible at each LOD tier so that the rendering layer
    has an unambiguous contract for what to show and hide.

    '
  epistemic_state: known
  constraints:
  - 'skeleton: uid + name only; rendered identically to lean in current implementation
    (canvas label only).'
  - 'lean (default): name label on Cytoscape canvas node. Rect = /dimensions/lean_w
    x /dimensions/lean_h.'
  - 'full: HTML overlay card showing name (bold), intent (wrapped), epistemic_state
    (italic/dimmed), constraints (bulleted). Rect = /dimensions/full_w x /dimensions/full_h.

    '
  - LOD state is per-node and survives collapse/expand cycles within a session.
  - Multiple nodes may be full simultaneously.
  design_notes: 'Initial design specified full at 240x320. Amend 3 set 160x120. Amend
    4 set 320x360 at user request. User then corrected to 240x180 as the canonical
    value. The LAYOUT.RECT data_registry reflects the canonical 240x180 target. The
    Amend 4 code (elkBridge.ts) must be updated from 320x360 to 240x180.

    '
- uid: LAYOUT.RECT
  name: Node Rect Derivation
  intent: Define that node rect dimensions are always derived as a function of LOD
    and collapse state and are never stored anywhere, so that there is no stale dimension
    state to reconcile.
  epistemic_state: known
  constraints:
  - Rect = f(lod, collapse-state-of-self, collapse-state-of-descendants). No storage.
  - 'lean tier default: 160 x 60 px. full tier default: 240 x 180 px.'
  - 'lean dimensions MUST NOT change: they are ELK layout sentinels used by elkBridge.ts.'
  - 'full dimensions require coordinated update of: elkBridge.ts constants, cyStyle.ts
    node[lod=''full''] selectors, and htmlOverlayLayer.ts reference box (referenceW,
    referenceH).'
  - Lens stores positions (node centers), not dimensions. Dimensions are re-derived
    on every render.
  design_notes: Initial design specified 240x320; Amend 3 set 160x120; Amend 4 set 320x360
    at user request; user then corrected to 240x180 as canonical. The Amend 4 code
    (elkBridge.ts) must be updated from 320x360 to 240x180. Dimensions are NOT stored
    in a data_registry -- they are tier defaults documented here and re-derived by
    the renderer. Lean dimensions (160x60) are correct and must not change.
  impl_pointers: 'src/webview/elkBridge.ts::LEAF_WIDTH, LEAF_HEIGHT, FULL_LOD_WIDTH,
    FULL_LOD_HEIGHT; src/webview/styles/cyStyle.ts (node[lod=''full''] selector);
    src/webview/overlay/htmlOverlayLayer.ts::createCard (referenceW, referenceH)

    '
  data_registry:
    dimensions:
      lean_w: 160
      lean_h: 60
      full_w: 240
      full_h: 180
- uid: LAYOUT.OVERLAY
  name: HTML Overlay Tracking
  intent: 'Govern how the HTML overlay cards follow node positions on every render
    frame, including visibility coupling to compound collapse, so that no overlay
    is ever left floating without an attached visible node.

    '
  epistemic_state: 'observed | gap: orphan bug (overlay floating after parent collapse)
    was diagnosed and a fix written (node.visible() guard in tickOne). Status of fix in
    current build is unverified: user still reports the bug as open.

    '
  constraints:
  - Every active overlay MUST be hidden when node.visible() === false.
  - 'Off-screen culling: hide overlay when renderedBoundingBox height < /thresholds/min_readable_height_px.'
  - Overlay position is derived from node.renderedBoundingBox() each frame. No cached
    positions after viewport change.
  - Overlay visibility is COUPLED to compound collapse state. If a node is not visible
    on the canvas (parent collapsed), its overlay must not be visible. No exceptions.
  - Overlays must scale uniformly without distortion, anchored to the top-left of
    the host node, and remain visible regardless of overflow clipping.
  - Full-LOD overlay is now also rendered for compound parent nodes, not just leaves;
    overlay shows the +/- cue for parents at bottom-left.
  design_notes: 'Transform model: CSS transform scale(s) where s = min(scaleX, scaleY).
    transform-origin is top-left. Reference box is /dimensions/full_w x /dimensions/full_h.
    The .ig-full-overlay element requires overflow: visible.'
  impl_pointers: 'src/webview/overlay/htmlOverlayLayer.ts::tickOne (visibility guard
    ~line 557); src/webview/overlay/htmlOverlayLayer.ts::tickAll

    '
  data_registry:
    thresholds:
      min_readable_height_px: 50
- uid: LAYOUT.WRAP
  name: Wrap Not Truncate
  intent: 'Ensure that full-LOD overlay text wraps to fit available width rather than
    being cut off, so the user can read complete field values.

    '
  epistemic_state: 'known: Amend 4 applied. white-space: normal + overflow-wrap: break-word
    on all text containers.'
  constraints:
  - All text containers in full-LOD overlays (name, intent, constraint) must wrap
    to fit available width rather than truncate.
  - Long words that exceed container width must break at character boundaries rather
    than overflow.
  - No line-clamping or ellipsis truncation in full-LOD overlays.
  - The overlay card root and all text containers must not clip overflowing text.
  design_notes: 'Implementation: white-space: normal + overflow-wrap: break-word on
    all text containers. overflow: visible on containers and card root. No -webkit-line-clamp
    or text-overflow: ellipsis. .ig-full-overlay overflow must be visible. (Amend
    4 applied.)'
  impl_pointers: src/webview/styles.css (.ig-fn-name, .ig-fn-intent, .ig-fn-constraint)
- uid: LAYOUT.CUES
  name: Always-Visible Expand/Collapse Cues
  intent: 'The user must always have a visible, clickable handle to expand or

    collapse a compound node, regardless of LOD. The handle is the only

    affordance for changing collapse state, so it cannot be hidden by

    selection, drag, hover, or LOD transitions.

    '
  epistemic_state: 'known: implemented via dedicated CueLayer (src/webview/overlay/cueLayer.ts).
    One DOM <button> per compound, tracked on cy.on(''render'') for every compound
    regardless of LOD; visible in lean and full LOD; hidden during edit mode. Click
    goes through CueLayer → ec.expand|collapse; no other path triggers compound transitions.'
  constraints:
  - A single neutral cue (one icon, no separate +/-) is present at bottom-left of
    every compound node.
  - The cue is visible in lean LOD and full LOD.
  - The cue is hidden only while the node is in edit mode.
  - Cue visibility does not depend on selection, hover, drag state, or focus.
  - Clicking the cue is the only event that toggles the compound's collapsed/expanded
    state (see INVARIANTS INV-9).
  - The cue is rendered by CueLayer, a dedicated DOM layer separate from HtmlOverlayLayer.
    CueLayer iterates every compound (node.isParent() OR node.hasClass('cy-expand-collapse-collapsed-node'))
    on init and tracks positions on every render frame.
  design_notes: "Cue rendering pulled out of HtmlOverlayLayer into\
    \ its own\nmodule (cueLayer.ts). Two architectural decisions ground this:\n\n\
    1. Single mechanism. Earlier waves had two cue rendering paths in tension\n  \
    \ (CSS background-image on cy nodes for lean; DOM div on overlay card for\n  \
    \ full). The two paths drifted in style, click-event semantics, and\n   lifetime.\
    \ CueLayer is the only path now: a real DOM <button> with a\n   real click handler,\
    \ positioned by cy.renderedBoundingBox() on every\n   frame. No stylesheet hacks;\
    \ no library cue (cueEnabled: false).\n\n2. LOD-independent. The cue exists for\
    \ every compound node regardless of\n   whether the overlay layer is rendering\
    \ a full-LOD card for it. This\n   fixes the \"no +/- in sight\" complaint where\
    \ lean compounds had no cue\n   because the overlay map was the only thing rendering\
    \ cue buttons.\n\nThe cytoscape-expand-collapse library's cue is disabled (cueEnabled:false)\n\
    so the only user-driven path is a click on a CueLayer button. CueLayer\nitself\
    \ calls ec.collapse/ec.expand directly because the action is local\nto cy state;\
    \ the gesture router does not need to know about it.\n"
  impl_pointers: src/webview/overlay/cueLayer.ts (NEUTRAL_CUE_SVG, CueLayer class,
    shouldHideCue + decideCompoundAction pure helpers); src/webview/main.ts (CueLayer
    construction + initCues + teardown lifecycle); src/webview/cyMount.ts (cueEnabled:false
    library config); src/webview/styles.css (.ig-compound-cue rule for the button)
- uid: LAYOUT.ALGORITHM
  name: Layout Algorithm
  intent: Define which ELK algorithm governs initial node placement and how pinned
    (position-stored) nodes interact with it, so that the layout strategy is explicit
    and its tradeoffs are documented.
  epistemic_state: 'known | undecided: Phase 2 per-compound algorithm choice not yet
    decided -- aesthetic regression possible'
  constraints:
  - 'MVP: ELK force algorithm globally with force.fixed = true per pinned node.'
  - Pinned nodes (position stored in active lens) are treated as fixed points; unpinned
    nodes flow around them.
  - A node is pinned iff its UID has a position entry in the active lens's nodes dict.
  - 'Phase 2 (deferred): per-compound algorithm choice -- compounds with no pinned
    children use layered; compounds with pins switch to force locally.'
  - 'Freeze-on-first-ELK-run strategy was rejected: positions break when nodes are
    added.'
  design_notes: 'MVP uses ELK force globally with force.fixed on pinned nodes. This
    is ELK''s standard support for user-authored pin constraints. See ELK docs: https://eclipse.dev/elk/reference/algorithms/org-eclipse-elk-force.html.
    Phase 2 per-compound algorithm was discussed but deferred due to unknown aesthetic
    regression risk when mixing layered and force within the same compound hierarchy.'
- uid: LAYOUT.AFFORDANCE
  name: Compound Parent Visual Distinction
  intent: 'Visually distinguish compound parent nodes from leaf nodes so the

    user can identify expandable nodes at a glance, without relying

    solely on the cue (LAYOUT.CUES).

    '
  epistemic_state: 'known: implemented via border-color emphasis on compound parents.'
  constraints:
  - Compound parents have a distinct visual treatment so they are recognizable as
    expandable.
  - The treatment is subtle, matches host theme variables, and does not introduce
    loud colors or obtrusive shapes.
  design_notes: 'Implemented via the cytoscape node:parent

    selector with a slightly emphasized border-color (host focus-border

    theme variable, falling back to #0078d4) and border-width 2px.

    Provides a subordinate cue to LAYOUT.CUES — the cue is the

    action affordance, this is the recognition affordance.

    '
  impl_pointers: src/webview/styles/cyStyle.ts (node:parent selector, border-color
    and border-width style properties)
- uid: EDITING.ENTER
  name: Edit Mode Entry
  intent: 'Define what happens on double-click to ensure the node enters edit mode
    cleanly with camera centered and gesture handlers locked.

    '
  epistemic_state: 'observed | gap: camera-center on entry not yet implemented; cy
    gesture lock uses pointer-events: none on overlay + DbltapRef suppression but
    LOD-toggle tap can still fire on slow double-clicks.

    '
  constraints:
  - Double-click on a full-LOD node triggers entry. A lean node must be toggled to
    full first.
  - 'On entry: (1) camera centers on node, (2) overlay switches to edit layout (all
    fields editable), (3) cy gesture handlers for the editing node are locked so that
    drag and tap events for that node do not fire during edit mode, (4) DbltapRef
    stamped.'
  - 'Dbltap suppression window: /timings/dbltap_suppression_ms ms.'
  - Only one node in edit mode at a time. Entry on node B while A is editing cancels
    A first.
  design_notes: 'cy gesture lock is implemented via pointer-events: none on the overlay
    element plus DbltapRef suppression in cyMount.ts::wireDblTapEdit. LOD-toggle tap
    can still fire on slow double-clicks (open gap, see epistemic_state).'
  impl_pointers: 'src/webview/cyMount.ts::wireDblTapEdit; src/webview/overlay/htmlOverlayLayer.ts::enterEditModeAtPoint

    '
- uid: EDITING.SCOPE
  name: Whole-Node Edit Form
  intent: 'Ensure that when a node is in edit mode, all its editable fields are presented
    as a single unified form so the user edits in one mental context without separate
    per-field activation gestures.

    '
  epistemic_state: 'risky: current implementation uses per-field dbltap hit-testing,
    presenting fields as independent targets. The EditNodeRequestType type is defined
    but the UI may not yet render all fields simultaneously. User: ''super glitchy
    atm.''

    '
  constraints:
  - Edit mode renders name, intent, and all constraint strings visible and editable
    simultaneously.
  - No field requires a separate double-click or gesture to enter its sub-edit state.
  - Tab key moves focus between fields within the form.
  - Escape cancels the entire form with no writes.
  - Enter in a single-line field (name) moves focus to next field, not submit.
  - Submit occurs on click outside the overlay card boundary (EDITING.EXIT).
  examples:
  - 'User double-clicks AUTH.1 (full-LOD). The overlay switches to a form: name field
    (single-line), intent field (multi-line textarea), constraints[0..n] (single-line
    each). All simultaneously editable. Clicking outside the card submits all modified
    fields in one EditNodeRequest.

    '
- uid: EDITING.EXIT
  name: Edit Mode Exit Condition
  intent: 'Define the exact boundary condition for exiting edit mode so the user knows
    unambiguously what counts as outside the node and accidental exits do not lose
    work.

    '
  epistemic_state: 'known: outside-click + Escape exit wired (router
    owns the document-level pointerdown and keydown listeners). Containment check
    uses the editing card''s getBoundingClientRect; Tab navigation between fields
    inside the card does not exit because containment, not blur, is the trigger.'
  constraints:
  - 'Exit (commit): pointerdown event anywhere outside the overlay card bounding rect.'
  - 'Exit (cancel): Escape key. No write occurs; all fields revert to pre-entry values.'
  - Internal tab-navigation between fields within the card MUST NOT trigger exit.
  - Blur on a field is NOT a valid exit trigger when focus moves to another field
    within the same card.
  - On exit (commit or cancel), cy gesture handlers for that node are restored.
  impl_pointers: src/webview/interaction/gestureRouter.ts::wireDocumentGestures (document-level
    pointerdown + keydown listeners); src/webview/overlay/htmlOverlayLayer.ts::commitNodeEdit
    / cancelNodeEdit (called by router on outside-click / Escape)
- uid: EDITING.PERSISTENCE
  name: Edit Write-Back
  intent: 'Ensure that every committed edit reaches the IG YAML file atomically with
    conflict detection so that no edit is silently lost.

    '
  epistemic_state: 'observed | gap: primary hypothesis:
    silent fileHash mismatch produces ok=false; disk not written but DOM already updated
    (optimistic update bug). Fix scope: remove optimistic DOM update; make conflict
    banner non-dismissable; log ok=false to output channel.

    '
  constraints:
  - Webview sends a single EditNodeRequest with all modified fields.
  - Host runs ONE parseDocument + multiple setIn + toString + writeFile cycle. Not
    one request per field.
  - DOM fields are NOT updated optimistically. Overlay shows pre-edit values until
    ok=true is received.
  - 'On ok=true: update DOM to newValue, store newFileHash, exit edit mode.'
  - 'On ok=false: revert DOM to pre-edit values; show non-dismissable banner with
    error text; log to output channel.'
  - 'Hash mismatch error text: ''File changed externally -- reload first.'' Banner
    must include Reload button.'
  - The selfWritePath flag on PanelEntry suppresses the file-watcher reload triggered
    by the edit write.
  impl_pointers: 'src/host/yamlEdit.ts (applyFieldEdit, hash check lines 98-103);
    src/editor/IntentGraphEditorProvider.ts (EditFieldRequestType handler lines 299-335);
    src/messaging/messageTypes.ts::EditNodeRequestType

    '
