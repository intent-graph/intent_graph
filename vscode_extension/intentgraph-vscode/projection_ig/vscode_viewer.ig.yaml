intentlinks:
- uid: INTERACTION.MODES_EDITING.ENTER
  src: INTERACTION.MODES
  dst: EDITING.ENTER
  intent: 'View mode is the precondition for edit-mode entry; EDITING.ENTER must verify
    the node is currently in view mode and full LOD before activating.

    '
- uid: EDITING.SCOPE_EDITING.PERSISTENCE
  src: EDITING.SCOPE
  dst: EDITING.PERSISTENCE
  intent: 'The whole-node edit form submits all modified fields together in a single
    EditNodeRequest; EDITING.PERSISTENCE owns the atomic write contract.

    '
- uid: LAYOUT.OVERLAY_INTERACTION.MODES
  src: LAYOUT.OVERLAY
  dst: INTERACTION.MODES
  intent: 'The overlay visibility must track both viewport geometry (tickOne) and
    node mode state, since a collapsed-parent node is never visually present regardless
    of mode.

    '
- uid: LENS_UI.SELECTOR_LENS_UI.SOURCES
  src: LENS_UI.SELECTOR
  dst: LENS_UI.SOURCES
  intent: 'The selector control is populated from the lenses dict delivered in LoadGraphResponse;
    LENS_UI.SOURCES defines that data contract.

    '
- uid: PERSISTENCE.IG_FILE_EDITING.PERSISTENCE
  src: PERSISTENCE.IG_FILE
  dst: EDITING.PERSISTENCE
  intent: 'The IG file write is the materialisation of the edit persistence contract;
    EDITING.PERSISTENCE specifies what PERSISTENCE.IG_FILE must implement.

    '
- uid: EDITING.PERSISTENCE_DIAGNOSTICS.EDIT_CONFLICT
  src: EDITING.PERSISTENCE
  dst: DIAGNOSTICS.EDIT_CONFLICT
  intent: 'Every ok=false write response must trigger the edit conflict notification;
    DIAGNOSTICS.EDIT_CONFLICT owns the UX contract for surfacing those failures.

    '
- uid: INVARIANTS_LAYOUT
  src: INVARIANTS
  dst: LAYOUT
  intent: INV-4 (no relayout on LOD toggle) and INV-8 (lens is sole store for user-authored
    visual state) are cross-cutting rules that LAYOUT and all its children must satisfy.
- uid: INVARIANTS_EDITING
  src: INVARIANTS
  dst: EDITING
  intent: 'INV-6 (no optimistic DOM update) is a cross-cutting rule that EDITING.PERSISTENCE
    and EDITING.SCOPE must enforce.

    '
- uid: INTERACTION.DRAG_PERSISTENCE.AUTOSAVE
  src: INTERACTION.DRAG
  dst: PERSISTENCE.AUTOSAVE
  intent: Drag-release event fires the PERSISTENCE.AUTOSAVE debounce; the drag gesture
    is the upstream trigger for all position writes.
- uid: PERSISTENCE.POSITIONS_LENSSCHEMA.NODESHAPE
  src: PERSISTENCE.POSITIONS
  dst: LENSSCHEMA.NODESHAPE
  intent: Position storage in the lens depends on the LensNodeEntry shape defined
    in LENSSCHEMA.NODESHAPE; any change to the schema directly impacts how positions
    are read and written.
- uid: LAYOUT.ALGORITHM_PERSISTENCE.POSITIONS
  src: LAYOUT.ALGORITHM
  dst: PERSISTENCE.POSITIONS
  intent: The ELK force algorithm honors pinned nodes by reading their positions from
    the active lens; LAYOUT.ALGORITHM requires PERSISTENCE.POSITIONS to define where
    pinned positions come from.
- uid: LENS_UI.CTRLPANEL.2_PERSISTENCE.AUTOCREATE
  src: LENS_UI.CTRLPANEL.2
  dst: PERSISTENCE.AUTOCREATE
  intent: Both LENS_UI.CTRLPANEL.2 (explicit user creation) and PERSISTENCE.AUTOCREATE
    (implicit first-drag creation) invoke the same host-side CreateLensRequest path;
    CTRLPANEL.2 must not duplicate the auto-create logic.
- uid: INVARIANTS_LENSSCHEMA
  src: INVARIANTS
  dst: LENSSCHEMA
  intent: INV-8 (lens is the only store for user-authored visual state) mandates the
    schema changes captured in LENSSCHEMA; any weakening of INV-8 would reduce the
    schema obligations.
- uid: EDITING.ENTER_INTERACTION.FOCUS
  src: EDITING.ENTER
  dst: INTERACTION.FOCUS
  intent: Edit-mode entry depends on the camera-center rule defined in INTERACTION.FOCUS;
    the entry sequence must invoke the focus animation rather than implement it independently.
    Edit-mode exit similarly relies on INTERACTION.FOCUS for the camera-restore rule.
- uid: INTERACTION.GESTURES_PERSISTENCE.AUTOSAVE
  src: INTERACTION.GESTURES
  dst: PERSISTENCE.AUTOSAVE
  intent: Single-click LOD toggle is the second trigger for the auto-save debounce.
    AUTOSAVE must be wired to LOD-toggle events as well as drag-release.
- uid: INVARIANTS_PERSISTENCE
  src: INVARIANTS
  dst: PERSISTENCE
  intent: INV-5 (IG file is canonical) is the foundation of the persistence policy;
    all persistence decisions must derive from this invariant.
- uid: INVARIANTS_LAYOUT.OVERLAY
  src: INVARIANTS
  dst: LAYOUT.OVERLAY
  intent: INV-7 (overlay visibility must be coupled to node visibility at all times)
    directly governs every overlay tracking rule in LAYOUT.OVERLAY.
- uid: INTERACTION.DRAG_PERSISTENCE.AUTOCREATE
  src: INTERACTION.DRAG
  dst: PERSISTENCE.AUTOCREATE
  intent: Drag-release with no active lens triggers AUTOCREATE before AUTOSAVE; AUTOCREATE
    is a precondition of the drag-end persistence path.
- uid: EDITING.EXIT_INTERACTION.FOCUS
  src: EDITING.EXIT
  dst: INTERACTION.FOCUS
  intent: Edit-mode exit must invoke the camera-restore rule defined in INTERACTION.FOCUS;
    the focus animation is not reimplemented in EDITING.EXIT.
- uid: LENSSCHEMA.NODESHAPE_LENSSCHEMA.MIGRATION
  src: LENSSCHEMA.NODESHAPE
  dst: LENSSCHEMA.MIGRATION
  intent: Migration depends on the new node shape being fully defined; LENSSCHEMA.NODESHAPE
    is a precondition of LENSSCHEMA.MIGRATION.
- uid: LENSSCHEMA.NODESHAPE_LENSSCHEMA.VALIDATION
  src: LENSSCHEMA.NODESHAPE
  dst: LENSSCHEMA.VALIDATION
  intent: Validation rules operate on the new node shape; LENSSCHEMA.NODESHAPE must
    be defined before LENSSCHEMA.VALIDATION can be implemented.
- uid: OPERATIONS_INTERACTION
  src: OPERATIONS
  dst: INTERACTION
  intent: The operation vocabulary (single-click, double-click, drag, lens actions)
    is realised by the interaction model.
- uid: OPERATIONS_LENS_UI
  src: OPERATIONS
  dst: LENS_UI
  intent: The Manage Lens operation (create/rename/delete) is realised by LENS_UI
    and its control panel.
