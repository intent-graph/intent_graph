  - workspaceState is machine-local and not git-tracked.
  impl_pointers: src/editor/IntentGraphEditorProvider.ts (workspaceState access)
- uid: PERSISTENCE.LENS_STATE
  name: Active Lens -- In-Memory
  intent: 'Define that the currently-applied lens name is in-memory only on PanelEntry
