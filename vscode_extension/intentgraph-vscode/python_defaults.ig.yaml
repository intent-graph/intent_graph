# Python KB — Guidelines/style graph (second of two).
# Philosophy graph: python_kb_philosophy.yaml in this directory (intent_graphs/).
# See: intent_graphs/README.md

meta:
  name: "Python Projection Defaults"
  description: >
    Default rendering decisions for Python code projections, derived from the
    Python Development Guidelines KB. Each node mirrors a dimension from
    projection_dimensions.ig.yaml and provides an opinionated default. Override
    per project as needed. Philosophy (why) is in python_kb_philosophy.yaml.
  default_lens: test_4

nodes:
  # ── ROOT ──────────────────────────────────────────────────────────────
  - uid: PIG-PY.ROOT
    name: "Python Defaults"
    intent: >
      Default rendering decisions for Python code projections. Derived from the
      Python Development Guidelines knowledge base.
    epistemic_state: "known"
    constraints:
      - "Target Python 3.10+ unless project requires older"
    design_notes: "Python 3.10+ chosen for pattern matching, improved typing (PEP
      604 |), and broad ecosystem support; override only when targeting older
      runtimes."
    impl_pointers: "../LOD_1_stages/0_index.md"

  # ── L1: Structure ─────────────────────────────────────────────────────
  - uid: PIG-PY.STRUCT
    name: "Structure"
    intent: >
      Python project structure follows community conventions (PEP 517) with a
      preference for src-layout. Nesting is fine but only when there is strong
      reason.
    epistemic_state: "known"
    impl_pointers: "../LOD_2_phases/2.2_project_structure.md"

  - uid: PIG-PY.STRUCT.PKG
    name: "Package layout"
    intent: >
      Use src-layout for published packages (src/package_name/). Use flat layout
      for internal tools and rapid prototypes. Separation of concerns: source,
      tests, docs, config in distinct top-level dirs.
    epistemic_state: "known"
    constraints:
      - "src-layout is the default for any distributable package"
      - "Flat layout acceptable for internal tools and scripts"
      - "One package per repo unless monorepo is justified"
    impl_pointers: "../LOD_3_domains/2.2.1_directory_layout.md,
      ../LOD_3_domains/2.2.2_module_organization.md"

  - uid: PIG-PY.STRUCT.MOD
    name: "Module granularity"
    intent: >
      Prefer small, focused modules over large monolithic files. Each module
      should have a single clear responsibility. Avoid deep nesting — flat is
      better than nested.
    epistemic_state: "known"
    constraints:
      - "One module = one concern"
      - "Avoid modules over ~500 LOC — consider splitting"
      - "Package boundaries reflect architectural boundaries"
    impl_pointers: "../LOD_3_domains/2.2.2_module_organization.md"

  - uid: PIG-PY.STRUCT.DEP
    name: "Dependency management"
    intent: >
      Declare dependencies in pyproject.toml with version constraints. Use
      lockfiles for applications. Minimize dependency count.
    epistemic_state: "known"
    constraints:
      - "pyproject.toml is the single source for dependency declarations"
      - "Pin exact versions for applications (lockfile)"
      - "Use >= constraints for libraries"
      - "Separate dev/test dependencies from runtime"
    impl_pointers: "../LOD_2_phases/2.1_environment.md, ../LOD_2_phases/4.1_packaging.md"

  # ── L1: Implementation ────────────────────────────────────────────────
  - uid: PIG-PY.IMPL
    name: "Implementation"
    intent: >
      Python implementation follows PEP 8 naming, full type annotations on
      public APIs, polyglot paradigm choice (OOP for taxonomies, FP for
      transforms, imperative for control flow), and fail-fast error handling
      with domain-specific exceptions.
    epistemic_state: "known"
    impl_pointers: "../LOD_2_phases/3.1_implementation.md"

  - uid: PIG-PY.IMPL.NAME
    name: "Naming conventions"
    intent: >-
      Follow PEP 8 casing strictly. Invest time in names (the 20-Minute Rule):
      names must be hierarchical, unambiguous, and intuitive. QWERTY
    epistemic_state: "known"
    constraints:
      - "Modules: snake_case (user_service.py)"
      - "Classes: PascalCase (UserService)"
      - "Functions/variables: snake_case (get_user_by_id)"
      - "Constants: UPPER_SNAKE (MAX_RETRIES)"
      - "Names scale with scope — longer for wider visibility"
      - "No abbreviations unless universally understood (e.g., id, url)"
    impl_pointers: "../LOD_3_domains/3.1.1_naming.md,
      ../LOD_0_philosophy/0.5_communication_ux.md"

  - uid: PIG-PY.IMPL.TYPE
    name: "Type annotations"
    intent: >
      Type all function signatures (public and complex private). Use strict
      static checking in CI. Prefer concrete types over Any.
    epistemic_state: "known"
    constraints:
      - "All public function signatures must be typed"
      - "Complex private functions should be typed"
      - "Prefer built-in generics (list[str]) over typing module (List[str])"
      - "Use | union syntax over Optional (Python 3.10+)"
      - "Type checking enforced in CI (mypy or pyright)"
    impl_pointers: "../LOD_3_domains/3.1.2_typing.md"

  - uid: PIG-PY.IMPL.PARA
    name: "Paradigm balance"
    intent: >
      Polyglot pragmatism — choose the right paradigm for the problem. OOP for
      taxonomies and state containers, functional for data transforms and pure
      logic, imperative for sequential control flow. Prefer dataclasses/Pydantic
      over manual __init__.
    epistemic_state: "known"
    constraints:
      - "OOP for entities with identity and lifecycle"
      - "Functional (pure functions) for data transformations"
      - "dataclasses or Pydantic for structured data — not raw dicts"
      - "Avoid deep inheritance hierarchies — prefer composition"
      - "Use decorators judiciously, avoid metaprogramming unless justified"
    impl_pointers: "../LOD_3_domains/3.1.3_functions.md,
      ../LOD_3_domains/3.1.5_classes.md,
      ../LOD_0_philosophy/0.7_polyglot_pragmatism.md"

  - uid: PIG-PY.IMPL.ERR
    name: "Error handling"
    intent: >
      Fail fast with specific, domain-level exceptions. Error messages must help
      debugging. Never swallow exceptions silently.
    epistemic_state: "known"
    constraints:
      - "Custom exception classes for domain errors"
      - "Exceptions carry context (the failing value, not just a message)"
      - "Raise over return-None for expected failure paths"
      - "Never bare except — always catch specific types"
      - "Log at the boundary, raise through the interior"
    impl_pointers: "../LOD_3_domains/3.1.7_error_handling.md,
      ../LOD_0_philosophy/0.8_defensive_design.md"

  - uid: PIG-PY.IMPL.API
    name: "API surface design"
    intent: >
      Explicit public/private boundary. Public API is the contract — typed,
      documented, and stable. Private internals prefixed with _.
    epistemic_state: "known"
    constraints:
      - "Public API exported via __all__ in __init__.py"
      - "Private helpers prefixed with _ (single underscore)"
      - "Keyword-only args after * for functions with >2 parameters"
      - "Return concrete types, not implementation details"
      - "Validate at system boundaries, trust internal code"
    impl_pointers: "../LOD_3_domains/3.1.3_functions.md, ../LOD_3_domains/3.1.5_classes.md"

  - uid: PIG-PY.IMPL.IMP
    name: "Import style"
    intent: >
      Absolute imports by default. Group imports: stdlib, third-party, local.
      Let the linter (ruff/isort) enforce ordering.
    epistemic_state: "known"
    constraints:
      - "Absolute imports preferred over relative"
      - "No star imports (from x import *) except __init__.py re-exports"
      - "Import grouping: stdlib → third-party → local (blank line between)"
      - "isort via ruff enforces ordering automatically"
    impl_pointers: "../LOD_2_phases/3.1_implementation.md (imports),
      ../LOD_4_practices/4.2.1.1_ruff_config.md"

  # ── L1: Testing ───────────────────────────────────────────────────────
  - uid: PIG-PY.TEST
    name: "Testing"
    intent: >
      pytest is the framework. Testing pyramid: many unit, some integration, few
      E2E. Tests are code — same quality standards.
    epistemic_state: "known"
    impl_pointers: "../LOD_2_phases/3.2_testing.md"

  - uid: PIG-PY.TEST.STRAT
    name: "Test strategy"
    intent: >
      Follow the testing pyramid. Test behavior, not implementation — tests
      should survive refactoring. Reproduce bugs with a failing test before
      fixing.
    epistemic_state: "known"
    constraints:
      - "pytest as the test framework (not unittest)"
      - "Unit tests: fast (<100ms each), no external dependencies"
      - "Integration tests: real dependencies, marked with pytest markers"
      - "Test behavior at public API level, not private internals"
      - "Minimum coverage target negotiated per project"
    impl_pointers: "../LOD_3_domains/3.2.1_unit_testing.md,
      ../LOD_3_domains/3.2.2_integration_testing.md"

  - uid: PIG-PY.TEST.LAY
    name: "Test layout and naming"
    intent: >
      Separate tests/ directory mirroring source structure. Test files named
      test_<module>.py. Test functions named test_<behavior>.
    epistemic_state: "known"
    constraints:
      - "tests/ directory at project root, separate from src/"
      - "Mirror source structure: tests/test_<module>.py"
      - "Test names describe behavior: test_user_creation_validates_email"
      - "conftest.py for shared fixtures at appropriate directory level"
    impl_pointers: "../LOD_3_domains/3.2_testing.md, ../LOD_4_practices/3.2.3.1.1_conftest.md"

  - uid: PIG-PY.TEST.FIX
    name: "Fixture and mock style"
    intent: >
      Use pytest fixtures for test data setup. Factory functions over complex
      fixtures. Mock external services, not internal code.
    epistemic_state: "known"
    constraints:
      - "pytest fixtures for reusable setup/teardown"
      - "Factory functions (or factory_boy) for complex test objects"
      - "Mock external services (APIs, databases, filesystem)"
      - "Avoid mocking internal code — if you need to mock it, the design may be
        wrong"
      - "Use tmp_path fixture for filesystem tests"
    impl_pointers: "../LOD_4_practices/3.2.1.2.1_mock_examples.md,
      ../LOD_4_practices/3.2.1.2.2_patch_targets.md"

  # ── L1: Documentation ─────────────────────────────────────────────────
  - uid: PIG-PY.DOC
    name: "Documentation"
    intent: >
      Documentation is UX. Google-style docstrings on all public APIs. Inline
      comments explain why, not what. Keep docs close to code.
    epistemic_state: "known"
    impl_pointers: "../LOD_2_phases/3.3_documentation.md"

  - uid: PIG-PY.DOC.STR
    name: "Docstring style"
    intent: >
      Google style docstrings. Mandatory on all public functions, classes, and
      modules with non-obvious purpose. First line is imperative-mood summary.
    epistemic_state: "known"
    constraints:
      - "Google style (Args, Returns, Raises, Example sections)"
      - "First line: imperative mood, one sentence"
      - "All public functions and classes must have docstrings"
      - "Complex private functions should have docstrings"
      - "Include Examples section when usage is non-obvious"
    impl_pointers: "../LOD_3_domains/3.3.1_doc_levels.md,
      ../LOD_4_practices/3.3.3.1_google_style.md"

  - uid: PIG-PY.DOC.INL
    name: "Inline documentation"
    intent: >
      Comments explain why, not what. Code should be self-documenting via naming
      and structure. Use TODO/FIXME markers with context.
    epistemic_state: "known"
    constraints:
      - "Comments explain WHY, never WHAT (the code says what)"
      - "No commented-out code — version control tracks history"
      - "TODO/FIXME markers include author and context"
      - "Strategy comments before complex algorithms are encouraged"
    impl_pointers: "../LOD_3_domains/3.3_documentation.md"

  # ── L1: Tooling ───────────────────────────────────────────────────────
  - uid: PIG-PY.TOOL
    name: "Tooling and quality"
    intent: >
      Automate the mundane. Ruff for linting + import sorting, Black (or ruff
      format) for formatting, mypy/pyright for type checking. All enforced in CI
      and pre-commit.
    epistemic_state: "known"
    impl_pointers: "../LOD_2_phases/4.2_quality.md"

  - uid: PIG-PY.TOOL.LINT
    name: "Linting and formatting TEST123"
    intent: >
      Ruff as the single linter (replaces flake8, isort, pyupgrade). Black or
      ruff-format for formatting. Line length 88. Enforced via pre-commit hooks
      and CI.
    epistemic_state: "known"
    constraints:
      - "Ruff with rule sets: E, W, F, I, B, UP, SIM"
      - "Line length 88 (Black default)"
      - "Auto-format on save or pre-commit — no manual formatting debates"
      - "Pre-commit hooks for lint + format + type check"
    design_notes: "Single-tool choice (Ruff) reduces config drift and CI time; Black
      compatibility via ruff format."
    impl_pointers: "../LOD_4_practices/4.2.1.1_ruff_config.md,
      ../LOD_4_practices/4.2.2.1_black_config.md"

  - uid: PIG-PY.TOOL.PKG
    name: "Packaging conventions"
    intent: >
      pyproject.toml as the single project metadata and build config file. PEP
      517/518 compliant build system.
    epistemic_state: "known"
    constraints:
      - "pyproject.toml only — no setup.py, no setup.cfg"
      - "Build backend: hatchling, flit, or setuptools (project choice)"
      - "Version in pyproject.toml or dynamic via __version__"
      - "Entry points declared in pyproject.toml [project.scripts]"
    impl_pointers: "../LOD_2_phases/4.1_packaging.md,
      ../LOD_4_practices/4.2.3.1_pyproject_sections.md"

  # ── L1: Performance style ─────────────────────────────────────────────
  - uid: PIG-PY.PERF
    name: "Performance style"
    intent: >
      Write clear code first, optimize with data. Performance concerns shape
      code structure only when measured bottlenecks demand it.
    epistemic_state: "known"
    impl_pointers: "../LOD_2_phases/5.1_performance.md"

  - uid: PIG-PY.PERF.CONC
    name: "Concurrency and async patterns"
    intent: >
      Use async/await for I/O-bound concurrency. Use multiprocessing for
      CPU-bound parallelism. Avoid threads unless interfacing with blocking
      libraries.
    epistemic_state: "known"
    constraints:
      - "asyncio for I/O-bound concurrency (network, file system)"
      - "multiprocessing for CPU-bound parallelism"
      - "threading only when wrapping blocking third-party code"
      - "Prefer concurrent.futures for simple parallelism"
      - "No premature async — sync is simpler when concurrency isn't needed"
    impl_pointers: "../LOD_4_practices/5.1.6.1_asyncio_basics.md,
      ../LOD_4_practices/5.1.5.1_multiprocessing.md,
      ../LOD_4_practices/5.1.4.1_threading.md"

  # ── L3: Expansion from Python KB (one layer under each L2 leaf) ─────────
  - uid: PIG-PY.STRUCT.PKG.1
    name: "Src vs flat layout"
    intent: >
      Prefer src-layout for distributable packages (prevents importing
      uninstalled code; tests use installed package). Use flat layout for
      internal tools and rapid prototypes. Decision driven by distribution
      target (PyPI vs container/deploy).
    epistemic_state: "known"
    constraints:
      - "src-layout default for any distributable package"
      - "Flat layout acceptable for internal applications and scripts only"
  - uid: PIG-PY.STRUCT.PKG.2
    name: "Monorepo vs single package"
    intent: >
      Use a single package per repo unless multiple related packages share
      dependencies and tooling; then use monorepo with workspace config (e.g.
      uv/hatch workspace). One package per repo is the default.
    epistemic_state: "known"
    constraints:
      - "One package per repo unless monorepo is justified"
      - "Monorepo: shared deps, unified CI, workspace members in root pyproject"
  - uid: PIG-PY.STRUCT.PKG.3
    name: "Top-level dirs and supporting files"
    intent: >
      Separate source, tests, docs, and config in distinct top-level
      directories. Require pyproject.toml, README.md, .gitignore; recommend
      docs/, scripts/, LICENSE, CHANGELOG, CONTRIBUTING, pre-commit.
    epistemic_state: "known"
    constraints:
      - "tests/, docs/, scripts/ at top level; no source in root"
      - "pyproject.toml is single source for metadata and tool config"
  - uid: PIG-PY.STRUCT.MOD.1
    name: "Single concern and size"
    intent: >
      Each module should have a single clear responsibility. Prefer small,
      focused modules; avoid files over ~500 LOC and deep nesting. Package
      boundaries should reflect architectural boundaries.
    epistemic_state: "known"
    constraints:
      - "One module = one concern"
      - "Avoid modules over ~500 LOC — consider splitting"
      - "Flat is better than nested"
  - uid: PIG-PY.STRUCT.MOD.2
    name: "__init__.py and public API"
    intent: >
      Use __init__.py to define package exports (__all__) and optional lazy
      loading for large packages. Avoid star imports and heavy work at import
      time in __init__.py.
    epistemic_state: "known"
    constraints:
      - "Explicit __all__ for public API; minimal or lazy __init__ for large
        packages"
      - "No star imports or I/O at import time in __init__.py"
  - uid: PIG-PY.STRUCT.MOD.3
    name: "Circular import prevention"
    intent: >
      Avoid circular imports by keeping modules focused, using TYPE_CHECKING
      blocks or function-level imports when needed, and extracting shared types
      to a dedicated module. Prefer dependency injection over tight import
      coupling.
    epistemic_state: "known"
    constraints:
      - "Extract shared types to separate module when A and B depend on each
        other"
      - "Use TYPE_CHECKING and string annotations or import at function level as
        fallback"
  - uid: PIG-PY.STRUCT.DEP.1
    name: "Declaration in pyproject.toml"
    intent: >
      Declare all dependencies in pyproject.toml [project] and
      [project.optional-dependencies]. Use version constraints (>= for
      libraries); pyproject.toml is the single source of truth — no setup.py or
      requirements.txt for declaration.
    epistemic_state: "known"
    constraints:
      - "pyproject.toml is the single source for dependency declarations"
      - "Use >= constraints for libraries; pin exact for applications via
        lockfile"
  - uid: PIG-PY.STRUCT.DEP.2
    name: "Lockfiles for applications"
    intent: >
      For applications, use a lockfile (uv.lock, poetry.lock, requirements.lock)
      to pin exact versions and ensure reproducible installs. Generate from
      pyproject.toml and commit the lockfile.
    epistemic_state: "known"
    constraints:
      - "Pin exact versions for applications (lockfile)"
      - "Commit lockfile; use it for install in CI and production"
  - uid: PIG-PY.STRUCT.DEP.3
    name: "Dev and runtime separation"
    intent: >
      Separate runtime dependencies from development/test dependencies. Put dev
      and test tools (pytest, ruff, mypy) in [project.optional-dependencies]
      (e.g. dev) so production installs stay minimal.
    epistemic_state: "known"
    constraints:
      - "Separate dev/test dependencies from runtime"
      - "Install with optional group for dev: pip install -e '.[dev]' or uv sync
        --group dev"
  - uid: PIG-PY.IMPL.NAME.1
    name: "PEP 8 conventions by element"
    intent: >
      Follow PEP 8 strictly: modules and packages snake_case; classes and
      exceptions PascalCase (exceptions suffix Error); functions, methods,
      variables snake_case; constants UPPER_SNAKE. Use _prefix for internal,
      trailing _ to avoid keyword clash.
    epistemic_state: "known"
    constraints:
      - "Modules: snake_case (user_service.py); Classes: PascalCase
        (UserService)"
      - "Functions/variables: snake_case; Constants: UPPER_SNAKE"
      - "Private: single leading underscore; no __mangling unless required"
  - uid: PIG-PY.IMPL.NAME.2
    name: "Naming hierarchy and scope"
    intent: >-
      Names should scale with scope: short for loop locals (i, x), medium for
      functions and classes, longer for wider visibility. Invest time in names
      (20-Minute Rule); names must be unambiguous, pronounceable, searchable,
      and consistent. QWERTY
    epistemic_state: "known"
    constraints:
      - "Names scale with scope — longer for wider visibility"
      - "Avoid generic names (utils, helpers, misc); use plural for collections
        (models, exceptions)"
  - uid: PIG-PY.IMPL.NAME.3
    name: "Domain vocabulary and anti-patterns"
    intent: >
      Use domain vocabulary so names reveal intent. Class names: noun or noun
      phrase, suffix with role (Repository, Service, Handler). No abbreviations
      unless universally understood (id, url). Avoid naming anti-patterns
      (single-letter except in narrow scope, noise words).
    epistemic_state: "known"
    constraints:
      - "No abbreviations unless universally understood (e.g., id, url)"
      - "Class names describe what it is; suffix with role (UserRepository,
        ConfigService)"
  - uid: PIG-PY.IMPL.TYPE.1
    name: "Where to add type hints"
    intent: >
      Type all function signatures (public and complex private). Type public
      APIs comprehensively; let inference handle local variables. Use type
      checking in CI (mypy or pyright). Use Any sparingly and intentionally.
    epistemic_state: "known"
    constraints:
      - "All public function signatures must be typed"
      - "Complex private functions should be typed"
      - "Type checking enforced in CI (mypy or pyright)"
  - uid: PIG-PY.IMPL.TYPE.2
    name: "Type syntax and built-in generics"
    intent: >
      Prefer built-in generics (list[str], dict[str, int]) over typing.List. Use
      | for union (X | None) over Optional on Python 3.10+. Annotate returns and
      parameters with concrete types, not implementation details.
    epistemic_state: "known"
    constraints:
      - "Prefer built-in generics (list[str]) over typing module (List[str])"
      - "Use | union syntax over Optional (Python 3.10+)"
  - uid: PIG-PY.IMPL.TYPE.3
    name: "Protocols and gradual typing TEST"
    intent: >
      Use Protocol for structural subtyping when you need duck-typed interfaces.
      Apply gradual typing: start with public API and critical paths; expand
      coverage over time. Prefer concrete types over Any.
    epistemic_state: "known"
    constraints:
      - "Prefer concrete types over Any"
      - "Use Protocol for structural subtyping when interface is defined by
        usage"
  - uid: PIG-PY.IMPL.PARA.1
    name: "When to use functions vs classes vs modules"
    intent: >
      Use functions for single operations and data transforms; use classes when
      data has invariants, multiple operations on same data, or encapsulation.
      Use a module (not a class) for grouping functions with no shared state.
      Prefer dataclasses/Pydantic over manual __init__ for data holders.
    epistemic_state: "known"
    constraints:
      - "OOP for entities with identity and lifecycle"
      - "Functional (pure functions) for data transformations"
      - "Module with functions over class with only static methods"
  - uid: PIG-PY.IMPL.PARA.2
    name: "Dataclasses and structured data"
    intent: >
      Use dataclasses or Pydantic for structured data — not raw dicts. Use
      frozen dataclasses when immutability is required. Avoid deep inheritance
      for data models; prefer composition and flat hierarchies.
    epistemic_state: "known"
    constraints:
      - "dataclasses or Pydantic for structured data — not raw dicts"
      - "Avoid deep inheritance hierarchies — prefer composition"
  - uid: PIG-PY.IMPL.PARA.3
    name: "Function design and decorators"
    intent: >
      Functions: single responsibility, explicit inputs, clear outputs, 5–15
      lines ideal. Use decorators judiciously; avoid metaprogramming unless
      justified. Prefer keyword-only args after * for functions with more than
      two parameters.
    epistemic_state: "known"
    constraints:
      - "Use decorators judiciously, avoid metaprogramming unless justified"
      - "Keyword-only args after * for functions with >2 parameters"
  - uid: PIG-PY.IMPL.ERR.1
    name: "Fail fast and exception vs return"
    intent: >
      Fail fast: detect errors early and raise. Use exceptions for unexpected
      failure paths; use return values (e.g. None) for expected absence (e.g.
      find_user). Raise over return-None for real failure so callers must
      handle.
    epistemic_state: "known"
    constraints:
      - "Raise over return-None for expected failure paths"
      - "Distinguish: get_user (raise if missing) vs find_user (return None)"
  - uid: PIG-PY.IMPL.ERR.2
    name: "try/except discipline"
    intent: >-
      Catch specific exception types only; never bare except. Use else/finally
      when useful. Log at the boundary, raise through the interior. Never
      swallow exceptions silently. QWERTY
    epistemic_state: "known"
    constraints:
      - "Never bare except — always catch specific types"
      - "Log at the boundary, raise through the interior"
  - uid: PIG-PY.IMPL.ERR.3
    name: "Custom exceptions and error messages"
    intent: >
      Define custom exception classes for domain errors; exceptions should carry
      context (e.g. the failing value, field, reason). Error messages should
      state what happened, why it's a problem, and how to fix when known.
    epistemic_state: "known"
    constraints:
      - "Custom exception classes for domain errors"
      - "Exceptions carry context (the failing value, not just a message)"
  - uid: PIG-PY.IMPL.API.1
    name: "Public API and __all__"
    intent: >
      Public API is the contract: typed, documented, and stable. Export it
      explicitly via __all__ in __init__.py. Return concrete types from public
      functions, not implementation details.
    epistemic_state: "known"
    constraints:
      - "Public API exported via __all__ in __init__.py"
      - "Return concrete types, not implementation details"
  - uid: PIG-PY.IMPL.API.2
    name: "Private boundary and _prefix"
    intent: >
      Private internals are prefixed with a single underscore. Callers should
      not rely on private names; they may change without notice. Validate at
      system boundaries; trust internal code.
    epistemic_state: "known"
    constraints:
      - "Private helpers prefixed with _ (single underscore)"
      - "Validate at system boundaries, trust internal code"
  - uid: PIG-PY.IMPL.API.3
    name: "Function signatures and parameters"
    intent: >
      Order parameters: required positional, optional positional, *,
      keyword-only, **kwargs. Use keyword-only after * for functions with more
      than two parameters to avoid misuse and improve readability.
    epistemic_state: "known"
    constraints:
      - "Keyword-only args after * for functions with >2 parameters"
  - uid: PIG-PY.IMPL.IMP.1
    name: "Absolute imports and no star TEST"
    intent: >-
      Use absolute imports by default. Avoid star imports (from x import *)
      except in __init__.py for re-exporting public API. Relative imports only
      when appropriate within a package. TEST TEST
    epistemic_state: "known"
    constraints:
      - "Absolute imports preferred over relative"
      - "No star imports (from x import *) except __init__.py re-exports"
  - uid: PIG-PY.IMPL.IMP.2
    name: "Import grouping order"
    intent: >
      Group imports: standard library, then third-party, then local (blank line
      between groups). Order within groups is typically alphabetical or by
      isort/ruff so tooling enforces consistency.
    epistemic_state: "known"
    constraints:
      - "Import grouping: stdlib → third-party → local (blank line between)"
  - uid: PIG-PY.IMPL.IMP.3
    name: "Tool enforcement (ruff/isort)"
    intent: >
      Let the linter enforce import order and style. Ruff includes isort (I
      rules); use ruff check and ruff format so one tool handles lint and import
      sorting. No manual formatting debates — automate.
    epistemic_state: "known"
    constraints:
      - "• isort via ruff enforces ordering automatically"
  - uid: PIG-PY.TEST.STRAT.1
    name: "Pyramid and test mix"
    intent: >
      Follow the testing pyramid: many unit tests, some integration tests, few
      E2E. Unit tests are fast and isolated; integration tests use real
      dependencies and are marked (e.g. pytest markers). Minimum coverage target
      negotiated per project.
    epistemic_state: "known"
    constraints:
      - "pytest as the test framework (not unittest)"
      - "Unit tests: fast (<100ms each), no external dependencies"
      - "Integration tests: real dependencies, marked with pytest markers"
  - uid: PIG-PY.TEST.STRAT.2
    name: "Unit test discipline"
    intent: >
      Unit tests verify one behavior; use AAA (Arrange, Act, Assert). Test
      business logic, data transforms, edge cases, and error conditions. Do not
      test framework code, trivial getters, or third-party behavior. Reproduce
      bugs with a failing test before fixing.
    epistemic_state: "known"
    constraints:
      - "Test behavior at public API level, not private internals"
      - "One assertion per test (guideline); related assertions acceptable"
  - uid: PIG-PY.TEST.STRAT.3
    name: "Integration scope and isolation"
    intent: >
      Integration tests verify components together (DB, API, multi-service). Use
      test databases and isolation (e.g. rollback, testcontainers) so tests do
      not interfere. Balance count so suite stays runnable in CI.
    epistemic_state: "known"
    constraints:
      - "Test isolation: real but isolated deps (e.g. in-memory or dedicated
        test DB)"
  - uid: PIG-PY.TEST.LAY.1
    name: "tests/ layout and mirroring"
    intent: >
      Place tests in a tests/ directory at project root, separate from src/.
      Mirror source structure so tests/test_<module>.py maps to source modules.
      Optionally group by unit/, integration/, e2e/.
    epistemic_state: "known"
    constraints:
      - "tests/ directory at project root, separate from src/"
      - "Mirror source structure: tests/test_<module>.py"
  - uid: PIG-PY.TEST.LAY.2
    name: "Test file and function naming"
    intent: >
      Test files: test_<module>.py. Test functions: test_<behavior> or
      test_<unit>_<scenario>_<expected>. Test classes: Test<ClassName>. Names
      should describe behavior so failures are self-explanatory.
    epistemic_state: "known"
    constraints:
      - "Test names describe behavior: test_user_creation_validates_email"
  - uid: PIG-PY.TEST.LAY.3
    name: "conftest.py placement"
    intent: >
      Use conftest.py for shared fixtures at the appropriate directory level:
      project-wide in tests/conftest.py, integration-specific in
      tests/integration/conftest.py. Fixtures in conftest are auto-discovered by
      pytest.
    epistemic_state: "known"
    constraints:
      - "conftest.py for shared fixtures at appropriate directory level"
  - uid: PIG-PY.TEST.FIX.1
    name: "Pytest fixtures and scopes"
    intent: >
      Use pytest fixtures for reusable setup and teardown; prefer function scope
      by default. Use module or session scope only for expensive setup (e.g. DB
      schema). Yield for teardown; avoid higher-scoped fixture depending on
      lower-scoped.
    epistemic_state: "known"
    constraints:
      - "pytest fixtures for reusable setup/teardown"
      - "Scope: function (default), class, module, session — match lifetime to
        cost"
  - uid: PIG-PY.TEST.FIX.2
    name: "Factories for complex data"
    intent: >
      Use factory functions or factory_boy for complex test objects instead of
      one large fixture. Prefer tmp_path for filesystem tests. Keep fixtures
      focused and composable.
    epistemic_state: "known"
    constraints:
      - "Factory functions (or factory_boy) for complex test objects"
      - "Use tmp_path fixture for filesystem tests"
  - uid: PIG-PY.TEST.FIX.3
    name: "Mock external services only"
    intent: >
      Mock external services (APIs, databases, filesystem) to achieve speed and
      isolation. Do not mock internal code; if you need to mock it, the design
      may be wrong — prefer dependency injection and testing at public API.
    epistemic_state: "known"
    constraints:
      - "Mock external services (APIs, databases, filesystem)"
      - "Avoid mocking internal code — if you need to mock it, the design may be
        wrong"
  - uid: PIG-PY.DOC.STR.1
    name: "Where docstrings are required"
    intent: >
      Docstrings are mandatory on all public functions, classes, and modules
      with non-obvious purpose. Complex private functions should have
      docstrings. Match documentation level to audience (docstrings for
      developers using the API).
    epistemic_state: "known"
    constraints:
      - "All public functions and classes must have docstrings"
      - "Complex private functions should have docstrings"
  - uid: PIG-PY.DOC.STR.2
    name: "Google style sections"
    intent: >
      Use Google-style docstrings: Args, Returns, Raises, and Example (or Note)
      sections. Document parameters with type and purpose; document return value
      and exceptions raised. Include Examples when usage is non-obvious.
    epistemic_state: "known"
    constraints:
      - "Google style (Args, Returns, Raises, Example sections)"
      - "Include Examples section when usage is non-obvious"
  - uid: PIG-PY.DOC.STR.3
    name: "First line and imperative mood"
    intent: >
      First line of the docstring is an imperative-mood, one-sentence summary
      (e.g. "Fetch a user by ID."). No "This function fetches...". Extended
      description can follow for context and edge cases.
    epistemic_state: "known"
    constraints:
      - "First line: imperative mood, one sentence"
  - uid: PIG-PY.DOC.INL.1
    name: "Comments explain why not what"
    intent: >
      Inline comments explain why the code is written this way, not what it does
      — the code should be self-documenting for the what. Use comments for
      non-obvious business logic, workarounds, performance choices, and
      references to external resources.
    epistemic_state: "known"
    constraints:
      - "Comments explain WHY, never WHAT (the code says what)"
  - uid: PIG-PY.DOC.INL.2
    name: "TODO/FIXME conventions"
    intent: >
      Use TODO/FIXME/HACK/NOTE markers with context. Prefer TODO(username):
      description so ownership and intent are clear. Fix or remove before
      long-term merge when possible.
    epistemic_state: "known"
    constraints:
      - "TODO/FIXME markers include author and context"
  - uid: PIG-PY.DOC.INL.3
    name: "No commented-out code"
    intent: >
      Do not leave commented-out code in the tree; version control tracks
      history. Delete dead code; use git to recover if needed. Strategy comments
      before complex algorithms are encouraged.
    epistemic_state: "known"
    constraints:
      - "No commented-out code — version control tracks history"
  - uid: PIG-PY.TOOL.LINT.1
    name: "Ruff lint rules and config"
    intent: >
      Use Ruff as the single linter (replaces flake8, isort, pyupgrade). Enable
      rule sets: E, W, F, I, B, UP, SIM (and optionally PTH, RUF). Configure
      per-file ignores (e.g. tests allow assert S101; __init__ allow F401). Use
      fixable = ["ALL"] and run ruff check --fix.
    epistemic_state: "known"
    constraints:
      - "Ruff with rule sets: E, W, F, I, B, UP, SIM"
      - "Pre-commit hooks for lint + format + type check"
  - uid: PIG-PY.TOOL.LINT.2
    name: "Formatting and line length"
    intent: >
      Use Black or ruff format for formatting. Line length 88 (Black default).
      Configure in [tool.black] or [tool.ruff.format]. Auto-format on save or
      pre-commit so formatting is consistent and debate-free.
    epistemic_state: "known"
    constraints:
      - "Line length 88 (Black default)"
      - "Auto-format on save or pre-commit — no manual formatting debates"
  - uid: PIG-PY.TOOL.LINT.3
    name: "Enforcement in CI"
    intent: >
      Run lint and format checks in CI; fail the build on violations. Use
      pre-commit hooks locally so violations are caught before push. Single tool
      choice (Ruff) reduces config drift and CI time.
    epistemic_state: "known"
    constraints:
      - "Enforced via pre-commit hooks and CI"
  - uid: PIG-PY.TOOL.PKG.1
    name: "pyproject.toml as single config"
    intent: >
      Use pyproject.toml as the single project metadata and build config file.
      No setup.py or setup.cfg for standard metadata. PEP 517/518 compliant
      build system; declarative over imperative.
    epistemic_state: "known"
    constraints:
      - "pyproject.toml only — no setup.py, no setup.cfg"
  - uid: PIG-PY.TOOL.PKG.2
    name: "[project] and [build-system]"
    intent: >
      [project] defines name, version, description, requires-python,
      dependencies, optional-dependencies. [build-system] specifies
      build-backend (hatchling, flit-core, setuptools). Version may be static or
      dynamic (e.g. from __version__).
    epistemic_state: "known"
    constraints:
      - "Build backend: hatchling, flit, or setuptools (project choice)"
      - "Version in pyproject.toml or dynamic via __version__"
  - uid: PIG-PY.TOOL.PKG.3
    name: "Entry points and [tool.*]"
    intent: >
      Declare CLI and plugin entry points in [project.scripts] and
      [project.entry-points]. Use [tool.*] sections for tool config (ruff, mypy,
      pytest) so one file holds project and tool settings.
    epistemic_state: "known"
    constraints:
      - "Entry points declared in pyproject.toml [project.scripts]"
  - uid: PIG-PY.PERF.CONC.1
    name: "asyncio for I/O-bound concurrency"
    intent: >
      Use async/await (asyncio) for I/O-bound concurrency: network, file system,
      subprocess waits. Prefer asyncio.gather for concurrent tasks; handle
      timeouts and errors explicitly. Do not use async unless concurrency is
      needed — sync is simpler when sufficient.
    epistemic_state: "known"
    constraints:
      - "asyncio for I/O-bound concurrency (network, file system)"
      - "No premature async — sync is simpler when concurrency isn't needed"
  - uid: PIG-PY.PERF.CONC.2
    name: "multiprocessing for CPU-bound parallelism"
    intent: >
      Use multiprocessing for CPU-bound parallelism; the GIL does not apply
      across processes. Use Pool for map-style work; guard main with if __name__
      == "__main__" on Windows/macOS. Prefer concurrent.futures for simple
      parallelism when appropriate.
    epistemic_state: "known"
    constraints:
      - "multiprocessing for CPU-bound parallelism"
      - "Prefer concurrent.futures for simple parallelism"
  - uid: PIG-PY.PERF.CONC.3
    name: "threading only for blocking code"
    intent: >
      Use threading only when wrapping blocking third-party libraries (e.g.
      synchronous HTTP) or when the API requires a thread. Threads do not
      provide true CPU parallelism due to the GIL; use for I/O overlap or
      integration with blocking APIs.
    epistemic_state: "known"
    constraints:
      - "threading only when wrapping blocking third-party code"

