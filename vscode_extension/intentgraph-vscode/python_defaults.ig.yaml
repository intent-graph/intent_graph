# Intra-graph semantic links (requires, refines, dataflow)
intentlinks:
  - uid: PIG-PY.IMPL.ERR_PIG-PY.IMPL.API
    src: PIG-PY.IMPL.ERR
    dst: PIG-PY.IMPL.API
    intent: Error handling applies at the API boundary; IMPL.API defines where to
      validate, IMPL.ERR defines how.
  - uid: PIG-PY.IMPL.API_PIG-PY.IMPL.NAME
    src: PIG-PY.IMPL.API
    dst: PIG-PY.IMPL.NAME
    intent: The public API surface is expressed through names (functions,
      parameters, modules); naming conventions apply there first.
  - uid: PIG-PY.IMPL.TYPE_PIG-PY.IMPL.API
    src: PIG-PY.IMPL.TYPE
    dst: PIG-PY.IMPL.API
    intent: Type annotations are part of the public contract; typing discipline
      applies to the API surface.
  - uid: PIG-PY.TEST_PIG-PY.IMPL
    src: PIG-PY.TEST
    dst: PIG-PY.IMPL
    intent: Tests exercise implementation; the testing dimension assumes
      implementation exists and is the primary object under test.
  - uid: PIG-PY.TEST.STRAT_PIG-PY.IMPL.API
    src: PIG-PY.TEST.STRAT
    dst: PIG-PY.IMPL.API
    intent: Strategy to test at public API level depends on having an explicit,
      stable API boundary.
  - uid: PIG-PY.TEST.LAY_PIG-PY.STRUCT
    src: PIG-PY.TEST.LAY
    dst: PIG-PY.STRUCT
    intent: Test layout mirrors source structure; tests/ organization follows the
      project structure defined by STRUCT.
  - uid: PIG-PY.DOC.STR_PIG-PY.IMPL.API
    src: PIG-PY.DOC.STR
    dst: PIG-PY.IMPL.API
    intent: Docstring style applies to the public API; DOC.STR documents the
      contract defined by IMPL.API.
  - uid: PIG-PY.STRUCT.DEP_PIG-PY.STRUCT.PKG
    src: PIG-PY.STRUCT.DEP
    dst: PIG-PY.STRUCT.PKG
    intent: Dependency management (pyproject.toml, lockfiles) constrains and
      supports package layout and installability.
  - uid: PIG-PY.TOOL.LINT_PIG-PY.IMPL
    src: PIG-PY.TOOL.LINT
    dst: PIG-PY.IMPL
    intent: Linting enforces implementation style (naming, imports, format); tooling
      serves the implementation defaults.
  - uid: PIG-PY.TOOL.PKG_PIG-PY.STRUCT.DEP
    src: PIG-PY.TOOL.PKG
    dst: PIG-PY.STRUCT.DEP
    intent: Packaging conventions (pyproject.toml) are the single place where
      dependencies are declared; TOOL.PKG and STRUCT.DEP align.

# Inter-graph links to philosophy (grounding; not every node linked)
inter_intentlinks:
  - uid: pig-py-defaults:PIG-PY.IMPL.ERR_python-kb-philosophy:DEFENSIVE
    src: pig-py-defaults:PIG-PY.IMPL.ERR
    dst: python-kb-philosophy:DEFENSIVE
    intent: Fail-fast, validate at boundaries, and never swallow exceptions silently
      ground in Defensive Design.
  - uid: pig-py-defaults:PIG-PY.IMPL.API_python-kb-philosophy:DEFENSIVE
    src: pig-py-defaults:PIG-PY.IMPL.API
    dst: python-kb-philosophy:DEFENSIVE
    intent: Validate at system boundaries and trust internal code; explicit
      public/private boundary is defensive design.
  - uid: pig-py-defaults:PIG-PY.IMPL.NAME_python-kb-philosophy:COMMUNICATION
    src: pig-py-defaults:PIG-PY.IMPL.NAME
    dst: python-kb-philosophy:COMMUNICATION
    intent: Naming as UX, the 20-Minute Rule, and Hallway Test ground naming
      conventions in Communication as UX.
  - uid: pig-py-defaults:PIG-PY.IMPL.PARA_python-kb-philosophy:POLYGLOT
    src: pig-py-defaults:PIG-PY.IMPL.PARA
    dst: python-kb-philosophy:POLYGLOT
    intent: Polyglot pragmatism—OOP/FP/imperative by problem—grounds paradigm
      balance in Polyglot Pragmatism.
  - uid: pig-py-defaults:PIG-PY.IMPL.TYPE_python-kb-philosophy:DATACENTRICITY
    src: pig-py-defaults:PIG-PY.IMPL.TYPE
    dst: python-kb-philosophy:DATACENTRICITY
    intent: Type annotations make invalid states unrepresentable and support
      data-first design; typing grounds in Data-Centric Thinking.
  - uid: pig-py-defaults:PIG-PY.STRUCT_python-kb-philosophy:STRUCTURE
    src: pig-py-defaults:PIG-PY.STRUCT
    dst: python-kb-philosophy:STRUCTURE
    intent: Project structure and src-layout conventions ground in Structure Primacy
      (structure before implementation).
  - uid: pig-py-defaults:PIG-PY.STRUCT.MOD_python-kb-philosophy:STRUCTURE
    src: pig-py-defaults:PIG-PY.STRUCT.MOD
    dst: python-kb-philosophy:STRUCTURE
    intent: Module granularity and single-concern modules are an application of
      Structure Primacy at code level.
  - uid: pig-py-defaults:PIG-PY.STRUCT.DEP_python-kb-philosophy:REPRODUCIBILITY
    src: pig-py-defaults:PIG-PY.STRUCT.DEP
    dst: python-kb-philosophy:REPRODUCIBILITY
    intent: Lockfiles, version pinning, and dev/runtime separation ground dependency
      management in Reproducibility.
  - uid: pig-py-defaults:PIG-PY.DOC_python-kb-philosophy:COMMUNICATION
    src: pig-py-defaults:PIG-PY.DOC
    dst: python-kb-philosophy:COMMUNICATION
    intent: Documentation as UX and docstrings for the reader ground the
